// =====================================================================
// PARETO — HYPOTHESES tab
// =====================================================================
// Reads workbench/frontier_data.json (baked by hydrate_frontier_view.py).
// Scatter of 16,000 hypotheses in coverage × depth space, colored by
// actionability. Filter chips let the user restrict to a specific patient
// or mechanism family. Non-dominated points get a star marker.
let FRONTIER_DATA = null;                     // {meta, rows}
let CAPSID_MAP    = null;                     // {mech_tissue_key: [{rank, capsid_id, ...}]}
let PARETO_NARRATIVES = null;                 // {"P#|hypId": {narrative, model, ...}} — Opus-reasoned
let frontierPatientFilter   = 'all';         // 'all' | patient_label
let frontierFamilyFilter    = 'all';         // 'all' | '01'..'04'
let frontierFrontierOnly    = false;         // default: show every hypothesis as a dot
let frontierMode            = 'gap';         // 'scatter' | 'gap' — gap = Nature-style schematic
let frontierSelectedId      = null;          // hypothesis_id of clicked point
let frontierLoadInFlight    = false;

const FRONTIER_ACT_COLORS = {
  0: '#c0c4cb',   // no action
  1: '#f5b25b',   // upregulator / distal AAV
  2: '#4283e6',   // gene replacement / readthrough
  3: '#4a9d3f',   // exon-skip ASO (highest)
};

// 10-color patient palette (Category10-ish). Row is patient-specific
// when a lab-derived scoring factor differs per patient (fit, confidence,
// rescue_window, tissue_target_boost). Row is patient-agnostic (gray) if
// the scoring uses only cohort/database sources — none currently exist
// in the substrate, but we keep the fallback for when they land.
const FRONTIER_PATIENT_COLORS = {
  'P1':  '#1f77b4',   'P2':  '#ff7f0e',   'P3':  '#2ca02c',
  'P4':  '#d62728',   'P5':  '#9467bd',   'P6':  '#8c564b',
  'P7':  '#e377c2',   'P8':  '#17becf',   'P9':  '#bcbd22',
  'P10': '#7f7f7f',
};
const FRONTIER_AGNOSTIC_COLOR = '#c8ccd3';
const FRONTIER_FAMILY_LABELS = {
  '01': 'H01 · LoF/NMD',
  '02': 'H02 · BMD-like',
  '03': 'H03 · NMD tissue-graded',
  '04': 'H04 · Distal-isoform',
};

// Expand slim (array) rows into full row objects using the lookup
// tables in meta. Keeps downstream code (scatter, filters, detail
// panel) reading `.coverage`, `.pathway_name`, etc. as before.
function frontierExpand(raw) {
  const M = raw.meta;
  const patients = M.patients || [];
  const patientCohortByLabel = Object.fromEntries(
    patients.map(p => [p.label, {cohort: p.cohort, patient_id: p.patient_id}]));
  const expanded = raw.rows.map(a => {
    const patient = a[1];
    const mech    = a[2];
    const pw      = M.pathways[a[3]]  || {};
    const cell    = M.cells[a[4]]     || {};
    const variant = M.variants[patient] || {};
    const pc      = patientCohortByLabel[patient] || {};
    return {
      hypothesis_id: a[0],
      patient_label: patient,
      cohort: pc.cohort, patient_id: pc.patient_id,
      mechanism_family: mech,
      mechanism_desc: M.mechanism_descs[mech] || '',
      variant_hgvsc: variant.hgvsc, variant_hgvsp: variant.hgvsp,
      variant_exon:  variant.exon,
      pathway_id:  a[3],
      pathway_name: pw.name,
      pathway_dgc_coverage: pw.dgc,
      cell_type: a[4], tissue: cell.tissue,
      cell_dgc_completeness: cell.dgc,
      cell_tissue_relevance: cell.rel,
      coverage: a[5], depth: a[6], actionability: a[7],
      n_predicted: a[8], n_observed: a[9], n_intersect: a[10],
      predicted_phenotypes: M.phenotype_sets[a[11]] || [],
      observed_phenotypes:  M.phenotype_sets[a[12]] || [],
      is_pareto_within_patient: a[13],
      is_pareto_global: a[14],
      weighted_fit:           a[15] || 0,
      max_predicted_severity: a[16] || 0,
      predicts_severe:        a[17] || 0,
      therapeutic_reach:      a[18] || 0,
      confidence:             a[19] || 0,
      hypothesis_score:       a[20] || 0,
      hypothesis_strength:    a[21] || 0,
      aav_viability:          a[22] || 0,
    };
  });
  return {meta: M, rows: expanded};
}

function frontierEnsureLoaded(onLoaded) {
  if (FRONTIER_DATA) { onLoaded(); return; }
  if (frontierLoadInFlight) return;
  frontierLoadInFlight = true;
  const t0 = performance.now();
  Promise.all([
    fetch('frontier_data.json?v=3').then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); }),
    fetch('capsid_map.json?v=1').then(r => r.ok ? r.json() : null).catch(() => null),
    fetch('pareto_frontier_narratives.json?v=1').then(r => r.ok ? r.json() : null).catch(() => null),
  ])
    .then(([d, capsidMap, paretoNarr]) => {
      FRONTIER_DATA = frontierExpand(d);
      CAPSID_MAP    = capsidMap || {};
      PARETO_NARRATIVES = paretoNarr || {};
      console.log(`[frontier] loaded ${FRONTIER_DATA.rows.length} rows in ${(performance.now() - t0).toFixed(0)}ms`);
      console.log(`[capsid] loaded ${Object.keys(CAPSID_MAP).length} archetypes`);
      console.log(`[pareto-narratives] loaded ${Object.keys(PARETO_NARRATIVES).length} Opus-reasoned narratives`);
      frontierLoadInFlight = false;
      onLoaded();
    })
    .catch(err => {
      frontierLoadInFlight = false;
      console.error('[frontier] load failed:', err);
      const el = document.querySelector('.fr-loading');
      if (el) el.innerHTML = `<span style="color:#c94a4a">
        Failed to load frontier_data.json: ${esc(String(err))}<br>
        <span style="font-size:11px">Check the browser console for details.</span></span>`;
    });
}

// Two-objective axes — both continuous, computed in the bake:
//   X = hypothesis_strength (weighted_fit × xlab_bonus + confidence)
//   Y = aav_viability       (tissue_delivery × payload_fit × dgc_rescue
//                            × precedent × tissue_target_boost × rescue_window)
// These are genuinely orthogonal — "how much I believe it" vs "how deliverable
// it is". Pareto membership means no other hypothesis beats you on BOTH.
// Curated overlay picks the highest-strength Set-B row per (patient, mech).
function frontierComputeScores() {
  if (!FRONTIER_DATA || FRONTIER_DATA._scored) return;
  FRONTIER_DATA.rows.forEach(r => {
    r.is_curated = false;
    r.curated_rank = null;
  });
  if (DATA?.patients) {
    DATA.patients.forEach(p => {
      const patLabel = p.label || p.name || p.id;
      (p.hypothesisRanking || []).forEach(h => {
        const family = h.mechanismFamily || h.id;
        const candidates = FRONTIER_DATA.rows.filter(r =>
          r.patient_label === patLabel && r.mechanism_family === family);
        if (!candidates.length) return;
        candidates.sort((a, b) => b.hypothesis_strength - a.hypothesis_strength);
        candidates[0].is_curated = true;
        candidates[0].curated_rank = h.rank;
        candidates[0].curated_claim = h.claim || h.fit;
      });
    });
  }
  FRONTIER_DATA._scored = true;
}

// Non-dominated set on (hypothesis_strength, aav_viability). Both maximised.
// Sort by strength DESC; sweep tracking best-aav-seen. A row is on the
// frontier iff its aav is strictly greater than every earlier-seen row
// (which had ≥ strength). That's the textbook 2D skyline / non-dominated
// sort — see /home/ubuntu/dmd_inference_env/PARETO_REFACTOR_PLAN.md.
function frontierComputePareto(rows) {
  const idx = rows.map((_, i) => i);
  idx.sort((a, b) => rows[b].hypothesis_strength - rows[a].hypothesis_strength
                  || rows[b].aav_viability       - rows[a].aav_viability);
  let bestAav = -Infinity;
  const isFrontier = new Array(rows.length).fill(false);
  for (const i of idx) {
    if (rows[i].aav_viability > bestAav + 1e-9) {
      isFrontier[i] = true;
      bestAav = rows[i].aav_viability;
    }
  }
  return isFrontier;
}

// Apply the current filter set → filtered array + a "shown" flag per row.
// Pareto is computed PER-PATIENT so each patient contributes their own
// frontier stars — otherwise the single globally-dominant hypothesis
// (P1's casimersen chain) swallows every other patient's frontier.
function frontierFiltered() {
  if (!FRONTIER_DATA) return [];
  frontierComputeScores();
  // Build the set of (patient, mechanism_family) pairs that actually exist in
  // each patient's curated hypothesisRanking. Rows for combos outside that
  // set are hypothetical — clicking one produced a misleading fallback
  // showing another patient's data. Drop them so every dot maps to real data.
  const validCombos = new Set();
  (DATA?.patients || []).forEach(pt => {
    (pt.hypothesisRanking || []).forEach(h => {
      validCombos.add(`${pt.id}|${h.mechanismFamily || h.id}`);
    });
  });
  let rows = FRONTIER_DATA.rows.filter(r => {
    if (frontierPatientFilter !== 'all' && r.patient_label !== frontierPatientFilter) return false;
    if (!validCombos.has(`${r.patient_label}|${r.mechanism_family}`)) return false;
    return true;
  });
  // Compute a single Pareto frontier across the filtered set on
  // (hypothesis_strength, aav_viability) — both maximised. This is the
  // frontier that "★ frontier only" filters to and that the staircase draws.
  rows.forEach(r => { r.is_frontier_viz = false; });
  const flags = frontierComputePareto(rows);
  rows.forEach((r, i) => { if (flags[i]) r.is_frontier_viz = true; });
  if (frontierFrontierOnly) rows = rows.filter(r => r.is_frontier_viz);
  return rows;
}

// SVG scatter — coverage × depth grid.
//   X = coverage (0..1, discrete)
//   Y = depth (1..5, integer)
//   Shape: star = actionable (act > 0), dot = non-actionable
//   Size = hypothesis_score (0..1) → radius 4..22
//   Color = actionability (or gray for act=0)
//   Frontier envelope: dashed line connecting the pareto-optimal points
//   on (coverage, depth), sorted by coverage.
function frontierSvg() {
  const W = 780, H = 500;
  const PAD_L = 68, PAD_R = 20, PAD_T = 20, PAD_B = 52;
  const plotW = W - PAD_L - PAD_R;
  const plotH = H - PAD_T - PAD_B;

  const rows = FRONTIER_DATA ? frontierFiltered() : [];
  const front = rows.filter(r => r.is_frontier_viz);
  const dom   = rows.filter(r => !r.is_frontier_viz);

  const xVal = r => r.hypothesis_strength;
  const yVal = r => r.aav_viability;

  // Auto-scale to observed range with 5% padding either side, so the
  // empty lower-left (where nothing actually lands) doesn't waste plot
  // real estate.
  let xMin = Infinity, xMax = -Infinity, yMin = Infinity, yMax = -Infinity;
  rows.forEach(r => {
    const xv = xVal(r), yv = yVal(r);
    if (xv < xMin) xMin = xv;
    if (xv > xMax) xMax = xv;
    if (yv < yMin) yMin = yv;
    if (yv > yMax) yMax = yv;
  });
  if (!isFinite(xMin)) { xMin = 0; xMax = 1; yMin = 0; yMax = 1; }
  const xRange = Math.max(xMax - xMin, 0.05);
  const yRange = Math.max(yMax - yMin, 0.05);
  const xLo = xMin - xRange * 0.05;
  const xHi = xMax + xRange * 0.05;
  const yLo = yMin - yRange * 0.05;
  const yHi = yMax + yRange * 0.05;
  const x2px = v => PAD_L + ((v - xLo) / (xHi - xLo)) * plotW;
  const y2px = v => PAD_T + plotH - ((v - yLo) / (yHi - yLo)) * plotH;

  // Deterministic jitter (repeatable across renders). Use two different
  // hashes for X and Y so points don't move on a diagonal.
  const jitter = (id, span, salt) => {
    const s = id + (salt || '');
    let h = 5381;
    for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
    // Map to [-0.5, 0.5]
    return (((h >>> 0) % 10000) / 10000 - 0.5) * span;
  };

  // Compute 5 nicely-rounded ticks across the auto-scaled range.
  const niceTicks = (lo, hi) => {
    const range = hi - lo;
    const rough = range / 4;
    // Round to a "nice" step: 0.01, 0.02, 0.05, 0.1, 0.2, 0.25, 0.5...
    const mag = Math.pow(10, Math.floor(Math.log10(rough)));
    const norm = rough / mag;
    let step;
    if (norm < 1.5) step = 1 * mag;
    else if (norm < 3) step = 2 * mag;
    else if (norm < 7) step = 5 * mag;
    else step = 10 * mag;
    const t0 = Math.ceil(lo / step) * step;
    const ticks = [];
    for (let t = t0; t <= hi + step * 0.001; t += step) ticks.push(t);
    return ticks;
  };
  const xTicks = niceTicks(xLo, xHi);
  const yTicks = niceTicks(yLo, yHi);
  const gridX = xTicks.map(t => `
    <line x1="${x2px(t)}" y1="${PAD_T}" x2="${x2px(t)}" y2="${H - PAD_B}"
          stroke="#eef1f5" stroke-width="1"/>
    <text x="${x2px(t)}" y="${H - PAD_B + 14}" text-anchor="middle"
          font-size="10" fill="#6b7580">${t.toFixed(2)}</text>`).join('');
  const gridY = yTicks.map(t => `
    <line x1="${PAD_L}" y1="${y2px(t)}" x2="${W - PAD_R}" y2="${y2px(t)}"
          stroke="#eef1f5" stroke-width="1"/>
    <text x="${PAD_L - 6}" y="${y2px(t) + 3}" text-anchor="end"
          font-size="10" fill="#6b7580">${t.toFixed(2)}</text>`).join('');

  // Star path centered at origin
  const starPath = (cx, cy, r) => {
    let path = '';
    for (let i = 0; i < 10; i++) {
      const angle = -Math.PI / 2 + i * Math.PI / 5;
      const rad = i % 2 === 0 ? r : r * 0.42;
      const x = cx + rad * Math.cos(angle);
      const y = cy + rad * Math.sin(angle);
      path += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ' ' + y.toFixed(1) + ' ';
    }
    return path + 'Z';
  };

  // All dots same size, single neutral color. Stripped for clarity.
  const sizeOf = r => 6;

  const dot = (r, x, y, sz, fill, stroke, strokeW, extraClass) => {
    const label = `${esc(r.patient_label)} · H${r.mechanism_family} · ${esc(r.cell_type)}
${esc(r.pathway_name)}
strength=${(r.hypothesis_strength||0).toFixed(3)}  ·  aav=${(r.aav_viability||0).toFixed(4)}
  = fit×xlab_bonus + conf = ${(r.weighted_fit||0).toFixed(2)}×? + ${(r.confidence||0).toFixed(2)}
tissue=${r.tissue}  ·  act=${r.actionability}  ·  sev=${r.max_predicted_severity||0}`;
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${sz.toFixed(1)}"
             fill="${fill}" stroke="${stroke}" stroke-width="${strokeW}"
             class="fr-point ${extraClass}" data-hid="${r.hypothesis_id}">
        <title>${label}</title>
      </circle>`;
  };

  // Dominated background — cap at 4000 for performance.
  // Big jitter (±40px each axis) so points spread from their band into
  // a visible cloud. Frontier points get less jitter so they stay on
  // the envelope curve.
  // Position every row with a modest deterministic jitter so overlapping
  // ties spread visibly.
  const JITTER = 22;
  const pos = new Map();     // hypothesis_id -> {x, y}
  rows.forEach(r => {
    pos.set(r.hypothesis_id, {
      x: x2px(xVal(r)) + jitter(r.hypothesis_id, JITTER, 'x'),
      y: y2px(yVal(r)) + jitter(r.hypothesis_id, JITTER, 'y'),
    });
  });

  // Color by patient. Patient-agnostic rows would get gray fallback
  // (none in the current substrate).
  const fillOf = r => FRONTIER_PATIENT_COLORS[r.patient_label] || FRONTIER_AGNOSTIC_COLOR;
  const domRender = dom.slice(0, 5000);
  const domPts = domRender.map(r => {
    const {x, y} = pos.get(r.hypothesis_id);
    return dot(r, x, y, sizeOf(r), fillOf(r), '#222', 0.5, 'dominated');
  }).join('');
  const frontPts = front.map(r => {
    const {x, y} = pos.get(r.hypothesis_id);
    const isSel = r.hypothesis_id === frontierSelectedId;
    const strokeW = isSel ? 2.4 : 0.6;
    return dot(r, x, y, sizeOf(r), fillOf(r), '#222', strokeW,
                'is-frontier');
  }).join('');

  // Target zone: above the median of the ACHIEVABLE frontier on both axes.
  // Calibrating on `front` (not on all 16k rows) keeps the zone in the top-right
  // corner where hypotheses are simultaneously strong AND AAV-tractable —
  // the noise floor of dominated points is irrelevant.
  const percentile = (arr, p) => {
    if (!arr.length) return 0;
    const s = [...arr].sort((a, b) => a - b);
    return s[Math.min(s.length - 1, Math.floor(s.length * p))];
  };
  const zoneSrc = front.length >= 4 ? front : rows;
  const tzX0 = percentile(zoneSrc.map(xVal), 0.50);
  const tzY0 = percentile(zoneSrc.map(yVal), 0.50);
  const targetZone = (zoneSrc.length >= 4) ? `
    <rect x="${x2px(tzX0).toFixed(1)}" y="${PAD_T.toFixed(1)}"
          width="${(x2px(xHi) - x2px(tzX0)).toFixed(1)}"
          height="${(y2px(tzY0) - PAD_T).toFixed(1)}"
          fill="#fef3c7" stroke="#a16207" stroke-width="1.5" opacity="0.55"/>
    <text x="${((x2px(tzX0) + x2px(xHi)) / 2).toFixed(1)}"
          y="${(PAD_T + 12).toFixed(1)}"
          text-anchor="middle" font-size="10" fill="#92400e" font-weight="700">
      target zone
    </text>
    <text x="${((x2px(tzX0) + x2px(xHi)) / 2).toFixed(1)}"
          y="${(PAD_T + 24).toFixed(1)}"
          text-anchor="middle" font-size="9" fill="#92400e" font-style="italic">
      strong evidence + AAV-tractable
    </text>` : '';

  // Pareto staircase — uses un-jittered data coordinates so the line is
  // always monotone: right = stronger hypothesis, up = better AAV delivery.
  // For each consecutive frontier pair, step horizontally then vertically.
  let frontOutline = '';
  if (front.length >= 1) {
    const sorted = [...front].sort((a, b) => xVal(a) - xVal(b));
    const pts = [];
    // Start at the left plot edge at the y-level of the leftmost frontier point
    pts.push(`${PAD_L},${y2px(yVal(sorted[0])).toFixed(1)}`);
    for (let i = 0; i < sorted.length; i++) {
      const xi = x2px(xVal(sorted[i]));
      const yi = y2px(yVal(sorted[i]));
      if (i > 0) {
        // Horizontal step rightward at the previous point's y level
        pts.push(`${xi.toFixed(1)},${y2px(yVal(sorted[i - 1])).toFixed(1)}`);
      }
      pts.push(`${xi.toFixed(1)},${yi.toFixed(1)}`);
    }
    // Extend final step to the right plot edge
    pts.push(`${(PAD_L + plotW).toFixed(1)},${y2px(yVal(sorted[sorted.length - 1])).toFixed(1)}`);
    frontOutline = `<polyline points="${pts.join(' ')}" fill="none"
                     stroke="#4a9d3f" stroke-width="2.2"
                     stroke-linejoin="miter" stroke-linecap="square"/>`;
  }

  // Curated overlay — gold ring + rank badge on top of the dot.
  const curated = rows.filter(r => r.is_curated);
  const curatedPts = curated.map(r => {
    const {x, y} = pos.get(r.hypothesis_id);
    const sz = sizeOf(r);
    const ring = `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}"
                    r="${(sz + 5).toFixed(1)}" fill="none"
                    stroke="#b8890f" stroke-width="2.2" opacity="0.9"/>`;
    const badge = `<circle cx="${(x + sz + 2).toFixed(1)}" cy="${(y - sz - 2).toFixed(1)}"
                     r="8" fill="#b8890f" stroke="white" stroke-width="1.4"/>
                   <text x="${(x + sz + 2).toFixed(1)}" y="${(y - sz + 1).toFixed(1)}"
                     text-anchor="middle" font-size="10" font-weight="800"
                     fill="white">${r.curated_rank || '★'}</text>`;
    return ring + badge;
  }).join('');

  const axisTitles = `
    <text x="${PAD_L + plotW / 2}" y="${H - 6}" text-anchor="middle"
          font-size="12" font-weight="700" fill="#3d4652">
      Hypothesis strength →  (fit × lab-consistency + confidence)
    </text>
    <text x="16" y="${PAD_T + plotH / 2}" text-anchor="middle"
          font-size="12" font-weight="700" fill="#3d4652"
          transform="rotate(-90 16 ${PAD_T + plotH / 2})">
      Strength of AAV-based delivery ↑
    </text>
    <!-- Corner interpretation labels (X = strength, Y = AAV) -->
    <text x="${W - PAD_R - 8}" y="${PAD_T + 14}" text-anchor="end"
          font-size="11" font-weight="700" fill="#4a9d3f" opacity="0.85">
      strong hypothesis + AAV-tractable → act
    </text>
    <text x="${W - PAD_R - 8}" y="${H - PAD_B - 6}" text-anchor="end"
          font-size="10" fill="#c94a4a" opacity="0.75" font-style="italic">
      strong hypothesis but poor AAV fit · pick non-AAV modality
    </text>
    <text x="${PAD_L + 8}" y="${PAD_T + 14}" text-anchor="start"
          font-size="10" fill="#7b8390" opacity="0.7" font-style="italic">
      AAV-deliverable but weak evidence · validate first
    </text>
    <text x="${PAD_L + 8}" y="${H - PAD_B - 6}" text-anchor="start"
          font-size="10" fill="#a08a5f" opacity="0.7" font-style="italic">
      weak evidence + poor delivery · deprioritise
    </text>`;

  const domCountNote = dom.length > 4000
    ? `<text x="${W - PAD_R - 4}" y="${PAD_T + 12}" text-anchor="end"
             font-size="10" fill="#8a939c">
        ${(dom.length - 4000).toLocaleString()} dominated points hidden</text>`
    : '';

  return `<svg id="frontier-plot-svg" viewBox="0 0 ${W} ${H}"
               preserveAspectRatio="xMidYMid meet"
               style="width:100%;height:auto;max-height:560px;background:white;
                      border:1px solid var(--line);border-radius:6px">
    <g class="fr-grid">${gridX}${gridY}</g>
    ${targetZone}
    ${axisTitles}
    ${frontOutline}
    <g class="fr-dominated">${domPts}</g>
    <g class="fr-frontier">${frontPts}</g>
    <g class="fr-curated">${curatedPts}</g>
    ${domCountNote}
  </svg>`;
}

function capsidRecsHtml(row) {
  if (!CAPSID_MAP) return '';
  const key = `${row.mechanism_family}_${row.tissue}`;
  const recs = CAPSID_MAP[key];
  if (!recs || recs.length === 0) return '';
  const TROP_COLOR = {muscle: '#2ca02c', retinal: '#1f77b4'};
  const items = recs.map(c => {
    const col = TROP_COLOR[c.tropism] || '#888';
    const scoreBar = Math.round((c.mapping_score / 0.55) * 100);  // normalize ~0-100
    return `<div class="fr-capsid-row">
      <span class="fr-capsid-rank">#${c.rank}</span>
      <code class="fr-capsid-id" title="${c.tropism} tropism"
            style="border-left:3px solid ${col}">${esc(c.capsid_id)}</code>
      <span class="fr-capsid-metrics">
        muscle=${c.muscle_transduction.toFixed(2)} ·
        escape=${c.nab_escape.toFixed(2)} ·
        hepatotox=${c.hepatotoxicity.toFixed(2)}
      </span>
      <span class="fr-capsid-score" title="mapping score">${c.mapping_score.toFixed(3)}</span>
    </div>`;
  }).join('');
  return `<div class="fr-capsid-block">
    <div class="fr-capsid-h">
      <span class="fr-capsid-title">AAV capsid candidates</span>
      <span class="fr-capsid-sub">ranked by tissue tropism match × NAb escape × payload fit
        · Pareto 2 (simulated IV muscle delivery · ASSLNIA reference · v1 pipeline)</span>
    </div>
    ${items}
  </div>`;
}

// Detail panel for a clicked Pareto dot — renders the SAME chain-artifact
// component Explore uses. Maps the dot's mechanism_family (01..04) to the
// matching hypothesis. Each patient's ranking only contains 3 of the 4
// mechanisms, so if the dot's own patient doesn't have this mechanism we
// fall back to another patient that does — the layered chain structure is
// hypothesis-scoped, not patient-scoped, so the boxes still populate.
function frontierExploreDetail(p) {
  if (!FRONTIER_DATA) return '<div class="fr-detail-empty">loading…</div>';
  const row = FRONTIER_DATA.rows.find(r => r.hypothesis_id === frontierSelectedId);
  if (!row) {
    return `<div class="fr-detail-empty">
      Click a Pareto dot to load the matching hypothesis panel.<br>
      <span style="color:var(--ink-3);font-size:11px">
        Dots are colored by patient; the frontier staircase marks the non-dominated set.
      </span>
    </div>`;
  }
  const hypId = row.mechanism_family;
  const dotPatient = (DATA.patients || []).find(pt => pt.id === row.patient_label);
  const hasHyp = (pt) => (pt?.hypothesisRanking || []).some(r => r.id === hypId);

  // Prefer the dot's own patient, then the currently-focused patient,
  // then any patient that has this hypothesis in their ranking.
  let panelPatient = null;
  let usedFallback = false;
  if (hasHyp(dotPatient)) {
    panelPatient = dotPatient;
  } else if (hasHyp(p)) {
    panelPatient = p; usedFallback = true;
  } else {
    panelPatient = (DATA.patients || []).find(hasHyp) || dotPatient || p;
    usedFallback = true;
  }

  // Sync global focus so the hover popover (which reads currentHypId +
  // currentPatientId) resolves to the same storedHyp we're rendering — without
  // this the popover finds no premises for any box.
  currentPatientId = panelPatient.id;
  currentHypId     = hypId;

  const chain = renderChainArtifact(panelPatient, hypId, 0, {
    afterChain: capsidRecsHtml(row),
    paretoRow:  row,
  });
  if (!chain) {
    return `<div class="fr-detail-empty">
      Could not build chain for H${esc(hypId)}.
    </div>`;
  }
  const note = usedFallback ? `
    <div style="font-size:10px;color:#a16207;background:#fef8e6;border:1px solid #eadbb0;
                padding:6px 8px;border-radius:4px;margin-bottom:8px">
      Patient <b>${esc(row.patient_label)}</b> doesn't carry H${esc(hypId)} in their curated ranking;
      showing the chain as scored for <b>${esc(panelPatient.id)}</b> (any patient with this hypothesis
      exposes the same layered structure).
    </div>` : '';
  return `<div style="font-size:11px;color:var(--ink-3);margin-bottom:8px">
      Patient <b>${esc(row.patient_label)}</b>
      · hypothesis <b>H${esc(hypId)}</b>
      · pathway ${esc(row.pathway_name)}
      · cell ${esc(row.cell_type)}
    </div>${note}${chain}`;
}

function wireFrontierView(p) {
  document.querySelectorAll('[data-fr-pat]').forEach(btn => {
    btn.addEventListener('click', () => {
      frontierPatientFilter = btn.dataset.frPat; renderPage();

  const tog = document.querySelector('[data-fr-frontier]');
  if (tog) tog.addEventListener('click', () => {
    frontierFrontierOnly = !frontierFrontierOnly; renderPage();

  document.querySelectorAll('.fr-point').forEach(el => {
    el.addEventListener('click', () => {
      frontierSelectedId = el.dataset.hid;
      // Full re-render so both the SVG selection ring AND the Explore
      // hypothesis panel (which needs current DATA state) redraw together.
      renderPage();

  });
}

// ================================================================
// MAIN RENDER
// ================================================================
function renderPage() {
  const p = DATA.patients.find(x => x.id === currentPatientId) || DATA.patients[0];
  currentPatientId = p.id;

  const bodyCls = overviewMode === 'full'      ? 'overview-full'
                 : overviewMode === 'collapsed' ? 'overview-collapsed' : '';

  const bodyHtml = currentView === 'data'
    ? renderDataView(p)
    : currentView === 'lauren'
    ? renderLaurenView(p)
    : currentView === 'frontier'
    ? renderFrontierView(p)
    : currentView === 'therapeutics'
    ? renderTherapeuticsView()
    : `<div class="pc-body ${bodyCls}">
         ${renderLeftPanel(p)}
         ${renderRightPanel(p)}
       </div>`;

  document.getElementById('app').innerHTML = `
    ${renderTopStrip(p)}
    ${renderViewTabs()}
    ${bodyHtml}
    ${renderOverviewReopen()}
    ${renderEdgeModal(p)}
    ${renderVariantModal()}
  `;

  // Wire top-level view tabs
  document.querySelectorAll('[data-view]').forEach(btn => {
    btn.addEventListener('click', () => {
      currentView = btn.dataset.view;
      renderPage();
    });
  });

  // Explore Data click handlers only exist when its view is mounted
  if (currentView === 'data') wireDataView(p);
  if (currentView === 'frontier') wireFrontierView(p);
  if (currentView === 'therapeutics') wireTherapeuticsView();

  // Newest artifacts are at the top of the stream, so scroll the
  // right-panel body to the top when new artifacts arrive. Skip on
  // plain re-renders (tile toggles, view mode changes, etc.).
  if (scrollTopOnRender) {
    requestAnimationFrame(() => {
      const body = document.getElementById('right-body');
      if (body) body.scrollTop = 0;
      scrollTopOnRender = false;
    });
  }

  // Initialize any 3Dmol viewers whose <div> just entered the DOM.
  requestAnimationFrame(initPendingEsm3Viewers);

  // ---- wire patient selector (dropdown only — chips row removed) ----
  const picker = document.getElementById('pat-picker');
  if (picker) picker.addEventListener('change', () => {
    currentPatientId = picker.value;
    seedStream();
    renderPage();
  });

  // ---- Overview: tile expand + overview mode ----
  document.querySelectorAll('[data-tile-toggle]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.tileToggle;
      if (expandedTiles.has(id)) expandedTiles.delete(id); else expandedTiles.add(id);
      renderPage();
    });
  });
  document.querySelectorAll('[data-ov-mode]').forEach(btn => {
    btn.addEventListener('click', () => {
      overviewMode = btn.dataset.ovMode;
      renderPage();
    });
  });
  const ovReopen = document.getElementById('ov-reopen');
  if (ovReopen) ovReopen.addEventListener('click', () => {
    overviewMode = 'normal';
    renderPage();
  });

  // ---- rank row click (Dashboard-style table) → prepend chain artifact ----
  // The hypothesisTable widget emits <tr data-hid="…">; also catch clicks
  // on the compact patient-scoring strip above the table.
  document.querySelectorAll('table.hyp tbody tr[data-hid], .pss-row').forEach(row => {
    row.addEventListener('click', () => {
      const hid = row.dataset.hid;
      if (!hid) return;
      currentHypId = hid; currentEdgeId = null;
      rightStream = [{ type: 'chain', hypId: hid }, ...rightStream];
      scrollTopOnRender = true;
      renderPage();
    });
  });

  // ---- chain view toggle (shared across all chain artifacts) ----
  document.querySelectorAll('[data-chain-view]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      chainView = btn.dataset.chainView; currentEdgeId = null;
      renderPage();
    });
  });

  // ---- regenerate button (stub — would invoke world model) ----
  document.querySelectorAll('[data-regenerate]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const hid = btn.dataset.regenerate;
      alert(`Regenerate H${hid} — stub.\n\nIn production, this would re-invoke HYP-MODEL with the current premise set + patient context, ` +
            `producing a new patient_hypothesis row (with new generator_version and generated_at) alongside the current one. ` +
            `You'd then see the two versions diff in the UI.`);
    });
  });

  // ---- remove any single artifact from the stream ----
  document.querySelectorAll('[data-artifact-remove]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const idx = parseInt(btn.dataset.artifactRemove, 10);
      if (!isNaN(idx) && rightStream[idx]) {
        rightStream.splice(idx, 1);
        renderPage();
      }
    });
  });

  // ---- reset stream button ----
  const resetBtn = document.getElementById('reset-stream');
  if (resetBtn) resetBtn.addEventListener('click', () => {
    seedStream();
    renderPage();
  });

  // ---- chain edges → edge-evidence modal ----
  document.querySelectorAll('[data-edge-id]').forEach(hit => {
    hit.addEventListener('click', (ev) => {
      ev.stopPropagation();
      currentEdgeId = hit.dataset.edgeId;
      renderPage();
    });
  });
  const backdrop = document.getElementById('edge-modal-backdrop');
  if (backdrop) {
    backdrop.addEventListener('click', (ev) => {
      if (ev.target === backdrop) { currentEdgeId = null; renderPage(); }
    });
    const cbtn = document.getElementById('edge-modal-close');
    if (cbtn) cbtn.addEventListener('click', () => { currentEdgeId = null; renderPage(); });
  }

  // ---- variant detail modal (opened from lollipop marker clicks) ----
  document.querySelectorAll('[data-var-modal-close]').forEach(el =>
    el.addEventListener('click', (ev) => {
      // Only close on backdrop click or explicit close btn — not inner clicks
      if (el.classList.contains('pc-var-modal-backdrop') && ev.target !== el) return;
      variantModalId = null;
      renderPage();
    }));
  document.querySelectorAll('[data-var-modal-jump]').forEach(btn =>
    btn.addEventListener('click', () => {
      const pid = btn.dataset.varModalJump;
      if (pid && DATA.patients.some(x => x.id === pid)) {
        currentPatientId = pid;
      }
      variantModalId = null;
      currentView = 'mechanism';
      renderPage();
    }));

  // ---- chat input + suggestion chips + more-panel questions ----
  document.querySelectorAll('.pc-suggest, .pc-cat-item').forEach(b =>
    b.addEventListener('click', () => {
      ask(b.dataset.q);
      if (morePanelOpen) { morePanelOpen = false; renderPage(); }
    }));
  const form = document.getElementById('chat-form');
  const input = document.getElementById('chat-input');
  if (form) form.addEventListener('submit', (ev) => {
    ev.preventDefault();
    const q = (input.value || '').trim();
    if (q) { input.value = ''; ask(q); }
  });
  const moreToggle = document.getElementById('more-toggle');
  if (moreToggle) moreToggle.addEventListener('click', () => {
    morePanelOpen = !morePanelOpen; renderPage();
  });
  const moreClose = document.getElementById('more-close');
  if (moreClose) moreClose.addEventListener('click', () => {
    morePanelOpen = false; renderPage();
  });
}

// Drift-detection: on load, log any EXAMPLES question that routes to
// FALLBACK (null from planChat) so we can catch it before the user does.
function driftCheck() {
  if (!DATA || !MECH_DATA) return;
  const p = DATA.patients[0];
  const bad = buildExamples(p).flatMap(c => c.items)
    .filter(i => planChat(i.question, p) === null);
  if (bad.length) {
    console.warn('[patient_chat] questions routing to fallback:', bad.map(b => b.question));
  }
}

document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape' && currentEdgeId) { currentEdgeId = null; renderPage(); }
});

document.addEventListener('DOMContentLoaded', async () => {
  try {
    const [pat, mech] = await Promise.all([
      fetch('patient_data.json', {cache:'no-store'}),
      fetch('mechanism_data.json', {cache:'no-store'}),
    ]);
    if (!pat.ok) throw new Error(`patient_data.json HTTP ${pat.status}`);
    DATA = await pat.json();
    if (mech.ok) MECH_DATA = await mech.json();
    const qp = new URLSearchParams(location.search).get('patient');
    currentPatientId = (qp && DATA.patients.some(x => x.id === qp))
      ? qp : (DATA.featured[0] || DATA.patients[0].id);
    seedStream();
    renderPage();
    driftCheck();
  } catch (e) {
    document.getElementById('app').innerHTML =
      `<div style="padding:40px;color:var(--bad)">Failed to load: ${esc(e.message)}</div>`;
  }
});
</script>
</body>
</html>
