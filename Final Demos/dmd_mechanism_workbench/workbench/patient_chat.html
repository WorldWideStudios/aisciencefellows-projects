<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chat with Patient Data</title>
<!--
================================================================
  Patient-scoped generative view — two-panel layout.

    LEFT:  overview (collapsible tiles — patient context)
    RIGHT: generative panel
             · default: prioritized hypothesis rank + question chips
             · click a rank row → chain appears
             · ask a question → new artifact stacks
             · chat input sticky at bottom

  Reuses:
    - patient_data.json + mechanism_data.json
    - widget_palette.js (reasoningChain, edgeEvidenceBar)
    - theme.css

  The left panel has a two-position expand toggle: narrow (35%)
  or wide (55%). When wide, the right panel shrinks; both stay
  visible.
================================================================
-->
<link rel="stylesheet" href="theme.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  .pc-app { display: flex; flex-direction: column; height: 100vh;
    max-width: 1600px; margin: 0 auto; padding: 12px; gap: 8px; }

  /* --------- top strip: page title + patient picker --------- */
  .pc-top { display: flex; gap: 12px; align-items: center;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 16px; flex-shrink: 0; }
  .pc-top-title { font-size: 15px; font-weight: 700; letter-spacing: -0.01em;
    color: var(--ink); flex: 1; line-height: 1.2; }
  .pc-top-title .pc-top-title-gene { color: var(--accent); }
  .pc-top-pat { display: flex; align-items: center; gap: 8px;
    background: var(--bg); border: 1px solid var(--line-2); border-radius: 6px;
    padding: 4px 6px 4px 10px; }
  .pc-top-pat-lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--ink-3); font-weight: 700; white-space: nowrap; }
  .pc-picker { padding: 5px 8px; border: 1px solid var(--line-2);
    border-radius: 4px; background: white; font-size: 12px; font-family: inherit;
    color: var(--ink); min-width: 240px; }

  /* patient details tile (in Overview) --------------------------- */
  .pd-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
    padding-bottom: 8px; margin-bottom: 8px; border-bottom: 1px solid var(--line); }
  .pd-uid { font-size: 16px; font-weight: 700; letter-spacing: -0.01em;
    font-family: "SF Mono", Menlo, monospace; color: var(--ink); }
  .pd-cohort { font-size: 10px; color: var(--ink-3); }
  .pd-badge { font-size: 10px; padding: 2px 8px; border-radius: 3px;
    font-weight: 700; letter-spacing: 0.02em; }
  .pd-badge.DMD { background: var(--bad-soft); color: var(--bad); }
  .pd-badge.BMD { background: #e6f4ec; color: var(--good); }
  .pd-badge.IMD { background: var(--warn-soft); color: var(--warn); }
  .pd-badge.pending { background: var(--line); color: var(--ink-3); }
  .pd-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px 16px; }
  .pd-item { display: flex; flex-direction: column; gap: 2px; }
  .pd-k { color: var(--ink-3); font-size: 9px; text-transform: uppercase;
    letter-spacing: 0.05em; }
  .pd-v { color: var(--ink); font-size: 12px; font-weight: 600;
    font-family: "SF Mono", Menlo, monospace; word-break: break-all; }
  .pd-v.plain { font-family: inherit; }
  /* --------- top-level view tabs (Data | Mechanism) --------- */
  .pc-viewtabs { display: flex; gap: 4px; padding: 6px 10px 0 10px;
    background: transparent; flex-shrink: 0; }
  .pc-viewtab { background: var(--panel); border: 1px solid var(--line);
    border-bottom: none; border-radius: 8px 8px 0 0; padding: 8px 16px;
    font: inherit; font-size: 12px; font-weight: 600; color: var(--ink-3);
    cursor: pointer; letter-spacing: 0.02em; display: inline-flex;
    align-items: center; gap: 6px; }
  .pc-viewtab:hover { color: var(--ink); }
  .pc-viewtab.active { color: var(--accent); background: var(--panel);
    border-color: var(--accent); border-bottom: 1px solid var(--panel);
    margin-bottom: -1px; position: relative; z-index: 2; }
  .pc-viewtab-badge { font-size: 9px; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--ink-3); font-weight: 700;
    background: var(--bg); padding: 1px 5px; border-radius: 3px; }
  .pc-viewtab.active .pc-viewtab-badge { color: var(--accent);
    background: var(--accent-soft); }

  /* --------- Lauren's tab --------- */
  .pc-lauren { flex: 1; min-height: 0; overflow-y: auto;
    background: var(--bg); padding: 4px; }
  .lauren-section-h { font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.08em; font-weight: 700; color: var(--ink-3);
    padding: 12px 6px 8px; margin-top: 4px; }
  .lauren-overview { display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 8px; }
  /* No responsive fallback — keep the 4-col grid at all viewport widths so
     span-2 always means half-row. Tiles that overflow scroll internally. */
  .lauren-tile { background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column;
    min-height: 160px; }
  .lauren-tile-h { font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--ink-3); font-weight: 700;
    padding-bottom: 6px; margin-bottom: 8px; border-bottom: 1px solid var(--line-2); }
  .lauren-tile-big { font-size: 34px; font-weight: 800; line-height: 1;
    font-variant-numeric: tabular-nums; }
  .lauren-tile-big.ok { color: var(--accent); }
  .lauren-tile-big.warn { color: var(--warn); }
  .lauren-tile-big.bad { color: var(--bad); }
  .lauren-tile-sub { font-size: 11px; color: var(--ink-3); margin-top: 2px; }
  .lauren-tile-body { flex: 1; display: flex; flex-direction: column;
    justify-content: center; margin-top: 8px; }
  .lauren-mini-bar { display: grid; grid-template-columns: 80px 1fr 40px;
    gap: 6px; align-items: center; font-size: 11px; margin-bottom: 3px; }
  .lauren-mini-bar .lb-lbl { color: var(--ink-2); overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .lauren-mini-bar .lb-bar { background: var(--tile); height: 8px;
    border-radius: 2px; overflow: hidden; }
  .lauren-mini-bar .lb-bar-fill { display: block; height: 100%; }
  .lauren-mini-bar .lb-val { color: var(--ink-2); text-align: right;
    font-variant-numeric: tabular-nums; font-weight: 600; }
  .lauren-mini-bar.me { background: var(--accent-soft); padding: 1px 4px;
    border-radius: 3px; }
  .lauren-mini-bar.me .lb-lbl { color: var(--accent); font-weight: 700; }
  .lauren-donut { display: flex; align-items: center; gap: 12px; }
  .lauren-donut svg { flex-shrink: 0; }
  .lauren-donut-legend { font-size: 11px; color: var(--ink-2); }
  .lauren-donut-legend div { margin-bottom: 2px; }
  .lauren-hist { display: flex; align-items: flex-end; gap: 2px; height: 60px;
    padding: 4px 0; }
  .lauren-hist-bar { flex: 1; background: var(--accent); opacity: 0.5;
    border-radius: 1px 1px 0 0; position: relative; }
  .lauren-hist-bar.me { opacity: 1; background: var(--accent); }
  .lauren-hyp-table { background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 12px 14px; margin-top: 4px; }
  .lauren-hyp-row { display: grid; grid-template-columns: 40px 2.5fr 1fr 1fr 1fr 1.5fr;
    gap: 10px; padding: 8px 4px; align-items: center; font-size: 12px;
    border-bottom: 1px solid var(--line-2); }
  .lauren-hyp-row:last-child { border-bottom: none; }
  .lauren-hyp-row.head { color: var(--ink-3); font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700;
    border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  .lauren-hyp-id { font-family: "SF Mono",Menlo,monospace; font-weight: 700;
    text-align: center; }
  .lauren-hyp-id.top { background: var(--accent); color: white;
    border-radius: 3px; padding: 3px 4px; }
  .lauren-hyp-name { font-weight: 600; color: var(--ink); }
  .lauren-hyp-sub { color: var(--ink-3); font-size: 11px; margin-top: 2px; }
  .lauren-axis-bar { display: grid; grid-template-columns: 1fr 32px;
    gap: 5px; align-items: center; font-size: 11px; }
  .lauren-axis-bar .lb-bar { background: var(--tile); height: 10px;
    border-radius: 2px; overflow: hidden; }
  .lauren-axis-bar .lb-val { color: var(--ink-2); text-align: right;
    font-variant-numeric: tabular-nums; font-weight: 600; }

  /* --------- Explore Data view --------- */
  .pc-data { display: grid; gap: 10px; flex: 1; min-height: 0;
    grid-template-columns: 340px 1fr; }
  .pc-data-chips { background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; overflow-y: auto; padding: 12px 12px 24px; }
  .pc-data-right { background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; display: flex; flex-direction: column;
    min-height: 0; overflow: hidden; }
  .pc-data-chat { border-bottom: 1px solid var(--line); padding: 10px 12px;
    background: var(--bg); flex-shrink: 0; }
  .pc-data-chat-form { display: flex; gap: 6px; align-items: center; }
  .pc-data-chat-input { flex: 1; padding: 8px 10px; border: 1px solid var(--line-2);
    border-radius: 6px; background: white; font: inherit; font-size: 12px;
    color: var(--ink); }
  .pc-data-chat-input:focus { border-color: var(--accent); outline: none; }
  .pc-data-chat-btn { padding: 8px 14px; border: none; border-radius: 6px;
    background: var(--accent); color: white; font: inherit; font-size: 12px;
    font-weight: 600; cursor: pointer; }
  .pc-data-chat-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .pc-data-chat-btn.secondary { background: var(--bg); color: var(--ink-2);
    border: 1px solid var(--line-2); }
  .pc-data-chat-status { font-size: 10px; color: var(--ink-3);
    margin-top: 4px; text-align: right; font-family: "SF Mono",Menlo,monospace; }
  .pc-data-chat-status.err { color: var(--bad); }
  .pc-data-stream { flex: 1; overflow-y: auto; padding: 12px; }
  .pc-data-msg { padding: 10px 12px; margin-bottom: 8px; border-radius: 6px;
    font-size: 12px; line-height: 1.5; }
  .pc-data-msg.user  { background: var(--accent-soft); color: var(--ink);
    border-left: 3px solid var(--accent); }
  .pc-data-msg.agent { background: var(--tile); color: var(--ink-2);
    border-left: 3px solid var(--ink-3); }
  .pc-data-msg-role { font-size: 9px; text-transform: uppercase; font-weight: 700;
    letter-spacing: 0.06em; color: var(--ink-3); margin-bottom: 3px; }
  .pc-data-group { border: 1px solid var(--line-2); border-radius: 8px;
    padding: 10px 10px 4px; margin-bottom: 10px; background: var(--panel); }
  .pc-data-group-h { font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--ink-3); font-weight: 700;
    padding: 0 0 6px 2px; border-bottom: 1px dashed var(--line-2);
    margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .pc-data-group-h .close { background: transparent; border: none;
    color: var(--ink-3); cursor: pointer; font-size: 14px; margin-left: auto; }
  .pc-data-group-grid { display: grid; gap: 10px; }
  .pc-data-group-grid.n1 { grid-template-columns: 1fr; }
  .pc-data-group-grid.n2 { grid-template-columns: 1fr 1fr; }
  .pc-data-group-grid.n3plus { grid-template-columns: 1fr; }
  .pc-data-pillar { margin-bottom: 8px; border-radius: 6px;
    border: 1px solid var(--line-2); overflow: hidden;
    border-left-width: 3px; }
  .pc-data-pillar-h { display: flex; align-items: center; gap: 6px;
    width: 100%; text-align: left; font-family: inherit; cursor: pointer;
    background: var(--bg); border: none; border-bottom: 1px solid var(--line-2);
    padding: 8px 10px; font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.08em; font-weight: 700; color: var(--ink-2); }
  .pc-data-pillar-h:hover { background: var(--tile); }
  .pc-data-pillar.collapsed .pc-data-pillar-h { border-bottom: none; }
  .pc-data-pillar-h .pc-data-pillar-sub { flex: 1; font-weight: 500;
    text-transform: none; letter-spacing: 0; color: var(--ink-3);
    margin-left: 6px; }
  .pc-data-pillar-h .pc-data-pillar-caret { color: var(--ink-3);
    font-family: "SF Mono", Menlo, monospace; width: 12px; text-align: center; }
  .pc-data-pillar-h .pc-data-pillar-count { color: var(--ink-3);
    font-weight: 500; font-size: 10px; font-family: "SF Mono", Menlo, monospace; }
  .pc-data-pillar-body { padding: 6px 8px 8px; background: var(--panel); }
  .pc-data-pillar.collapsed .pc-data-pillar-body { display: none; }
  /* Per-pillar accent — border-left stripe + header text color.
     9-pillar biological cascade: evidence → observation → cause → propagation → endpoint.
     Roadmap chips still use --warn for the tag so they read distinct. */
  .pc-data-pillar[data-pillar="literature"]  { border-left-color: #7c3aed; }
  .pc-data-pillar[data-pillar="literature"]  .pc-data-pillar-h { color: #6d28d9; }
  .pc-data-pillar[data-pillar="labs"]        { border-left-color: #10b981; }
  .pc-data-pillar[data-pillar="labs"]        .pc-data-pillar-h { color: #059669; }
  .pc-data-pillar[data-pillar="variant"]     { border-left-color: #ea580c; }
  .pc-data-pillar[data-pillar="variant"]     .pc-data-pillar-h { color: #c2410c; }
  .pc-data-pillar[data-pillar="transcript"]  { border-left-color: #0891b2; }
  .pc-data-pillar[data-pillar="transcript"]  .pc-data-pillar-h { color: #0e7490; }
  .pc-data-pillar[data-pillar="protein"]     { border-left-color: #d97706; }
  .pc-data-pillar[data-pillar="protein"]     .pc-data-pillar-h { color: #b45309; }
  .pc-data-pillar[data-pillar="downstream"]  { border-left-color: #db2777; }
  .pc-data-pillar[data-pillar="downstream"]  .pc-data-pillar-h { color: #be185d; }
  .pc-data-pillar[data-pillar="cell type"]   { border-left-color: #0d9488; }
  .pc-data-pillar[data-pillar="cell type"]   .pc-data-pillar-h { color: #0f766e; }
  .pc-data-pillar[data-pillar="tissue type"] { border-left-color: #4f46e5; }
  .pc-data-pillar[data-pillar="tissue type"] .pc-data-pillar-h { color: #4338ca; }
  .pc-data-pillar[data-pillar="phenotype"]   { border-left-color: #64748b; }
  .pc-data-pillar[data-pillar="phenotype"]   .pc-data-pillar-h { color: #475569; }
  .pc-data-chip { display: block; width: 100%; text-align: left;
    background: var(--bg); border: 1px solid var(--line-2);
    border-radius: 6px; padding: 8px 10px; margin-bottom: 4px;
    font: inherit; font-size: 12px; color: var(--ink); cursor: pointer;
    line-height: 1.35; }
  .pc-data-chip:hover { border-color: var(--accent); color: var(--accent);
    background: var(--accent-soft); }
  .pc-data-chip.roadmap { color: var(--ink-3); font-style: italic; }
  .pc-data-chip.roadmap:hover { border-color: var(--line-2);
    color: var(--ink-2); background: var(--panel); }
  .pc-data-chip-tag { display: inline-block; font-size: 9px;
    text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700;
    color: var(--ink-3); background: var(--panel); padding: 1px 5px;
    border-radius: 3px; margin-right: 6px; vertical-align: middle; }
  .pc-data-chip.roadmap .pc-data-chip-tag { color: var(--warn); }
  .pc-data-empty { color: var(--ink-3); font-size: 12px; padding: 24px 8px;
    text-align: center; line-height: 1.5; }
  .pc-data-artifact { border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); padding: 12px; margin-bottom: 10px; }
  .pc-data-artifact-h { display: flex; align-items: center; gap: 8px;
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--ink-3); font-weight: 700; margin-bottom: 8px;
    padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .pc-data-artifact-h .badge { background: var(--accent-soft);
    color: var(--accent); padding: 2px 6px; border-radius: 3px;
    font-weight: 700; }
  .pc-data-artifact-h .badge.roadmap { background: var(--warn-soft, #fff4d6);
    color: var(--warn); }
  .pc-data-artifact-h .qref { margin-left: auto; color: var(--ink-3);
    font-family: "SF Mono", Menlo, monospace; }
  .pc-data-artifact-h .close { background: transparent; border: none;
    color: var(--ink-3); cursor: pointer; font-size: 14px; padding: 0 4px; }
  .pc-data-artifact-h .close:hover { color: var(--bad); }
  .pc-data-roadmap-body { color: var(--ink-2); font-size: 12px;
    line-height: 1.5; padding: 8px 4px; }
  .pc-data-roadmap-body b { color: var(--ink); }

  /* --------- variant detail modal (lollipop marker click) --------- */
  .pc-var-modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.35);
    z-index: 1000; display: flex; align-items: center; justify-content: center; }
  .pc-var-modal { background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 18px 20px; max-width: 480px; min-width: 360px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.25); }
  .pc-var-modal-h { display: flex; align-items: center; gap: 10px;
    padding-bottom: 10px; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
  .pc-var-modal-h .pat-id { font-size: 16px; font-weight: 700;
    font-family: "SF Mono",Menlo,monospace; color: var(--accent); }
  .pc-var-modal-h .close { margin-left: auto; background: transparent;
    border: none; color: var(--ink-3); cursor: pointer; font-size: 20px;
    line-height: 1; padding: 0 4px; }
  .pc-var-modal-h .close:hover { color: var(--bad); }
  .pc-var-modal table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .pc-var-modal td { padding: 4px 8px; }
  .pc-var-modal td:first-child { color: var(--ink-3); font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.04em; width: 130px; }
  .pc-var-modal td:last-child { font-weight: 600; }
  .pc-var-modal-actions { margin-top: 14px; display: flex; gap: 6px; }
  .pc-var-modal-btn { padding: 8px 14px; border-radius: 6px; font: inherit;
    font-size: 12px; font-weight: 600; cursor: pointer; border: none; }
  .pc-var-modal-btn.primary { background: var(--accent); color: white; }
  .pc-var-modal-btn.secondary { background: var(--bg); color: var(--ink-2);
    border: 1px solid var(--line-2); }

  /* --------- 2-panel body (Mechanism view) --------- */
  .pc-body { display: grid; gap: 10px; flex: 1; min-height: 0;
    grid-template-columns: 35% 1fr;
    transition: grid-template-columns 0.2s ease; }
  .pc-body.overview-full      { grid-template-columns: 1fr 0px; }
  .pc-body.overview-full  .pc-right { visibility: hidden; }
  .pc-body.overview-collapsed { grid-template-columns: 1fr; gap: 0; }
  .pc-body.overview-collapsed .pc-left { display: none; }
  .pc-ov-reopen { position: fixed; left: 10px; top: 68px; z-index: 100;
    background: var(--panel); border: 1px solid var(--line-2);
    border-radius: 6px; padding: 6px 10px; font: inherit; font-size: 11px;
    color: var(--ink-2); cursor: pointer; font-weight: 600;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .pc-ov-reopen:hover { border-color: var(--accent); color: var(--accent); }

  .pc-panel { background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; display: flex; flex-direction: column;
    min-height: 0; overflow: hidden; }
  .pc-panel-h { display: flex; align-items: center; gap: 8px;
    padding: 10px 14px; border-bottom: 1px solid var(--line);
    background: var(--bg); flex-shrink: 0; }
  .pc-panel-h-title { font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--ink-3); font-weight: 700; }
  .pc-panel-h-sub { font-size: 11px; color: var(--ink-3); margin-left: 6px; }
  .pc-panel-h-actions { margin-left: auto; display: flex; gap: 4px; }
  .pc-panel-btn { background: transparent; border: 1px solid transparent;
    color: var(--ink-3); padding: 3px 8px; border-radius: 4px; cursor: pointer;
    font-family: inherit; font-size: 12px; }
  .pc-panel-btn:hover { border-color: var(--line-2); color: var(--ink); }
  .pc-panel-btn.active { background: var(--accent-soft); border-color: var(--accent);
    color: var(--accent); font-weight: 600; }
  .pc-panel-body { flex: 1; overflow-y: auto; padding: 12px; }

  /* --------- Overview left panel --------- */
  /* biological-organization group headers (patient → variant → gene →
     protein → pathway → cell type → tissue type → phenotype) */
  .ov-group-h { font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--ink-3); font-weight: 700;
    padding: 8px 0 4px 4px; margin-top: 6px;
    border-bottom: 1px solid var(--line-2); }
  .ov-group-h:first-child { margin-top: 0; padding-top: 0; }
  .ov-group-h .ov-group-h-num { margin-right: 6px; color: var(--ink-3);
    font-weight: 700; opacity: 0.5; }
  .ov-group { margin-bottom: 4px; }

  .ov-tile { background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
  .ov-tile-toggle { width: 100%; background: transparent; border: none;
    padding: 10px 12px; font: inherit; text-align: left; display: flex;
    align-items: center; gap: 8px; cursor: pointer; color: var(--ink); }
  .ov-tile-toggle:hover { background: var(--panel); }
  .ov-tile-h { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--ink-2); font-weight: 700; }
  .ov-tile-summary { flex: 1; text-align: right; font-size: 10px; color: var(--ink-3); }
  .ov-tile-summary b { color: var(--ink-2); font-weight: 700; }
  .ov-tile-summary .warn { color: var(--bad); font-weight: 700; }
  .ov-tile-chevron { color: var(--ink-3); font-size: 10px; flex-shrink: 0; }
  .ov-tile-body { padding: 8px 12px 12px; border-top: 1px solid var(--line);
    background: var(--panel); }
  .ov-tile-body .foot { color: var(--ink-3); font-size: 10px; margin-top: 6px; }

  /* labs table */
  .ov-labs-group { margin-bottom: 8px; }
  .ov-labs-group-h { font-size: 9px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--ink-3); font-weight: 700; margin: 4px 0 3px 0;
    padding-bottom: 2px; border-bottom: 1px solid var(--line); }
  .ov-lab-row { display: grid; grid-template-columns: 1fr auto auto;
    gap: 8px; align-items: baseline; font-size: 11px; padding: 3px 0; }
  .ov-lab-lbl { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  .ov-lab-val { font-variant-numeric: tabular-nums; font-weight: 600; }
  .ov-lab-flag { font-size: 9px; text-transform: uppercase; padding: 0 5px;
    border-radius: 3px; font-weight: 700; }
  .ov-lab-flag.normal { color: var(--ink-3); background: var(--line); }
  .ov-lab-flag.low    { color: var(--warn); background: var(--warn-soft); }
  .ov-lab-flag.high   { color: var(--bad);  background: var(--bad-soft); }

  /* iso / cell rows (compact) */
  .ov-iso-row { display: grid; grid-template-columns: 60px 1fr 50px; gap: 8px;
    align-items: center; margin-bottom: 4px; font-size: 11px; }
  .ov-iso-lbl { color: var(--ink-2); font-family: "SF Mono", Menlo, monospace;
    font-size: 10px; font-weight: 600; }
  .ov-iso-track { height: 10px; background: var(--line); border-radius: 3px; }
  .ov-iso-fill { height: 100%; border-radius: 3px; }
  .ov-iso-fill.hit    { background: var(--bad); }
  .ov-iso-fill.spared { background: var(--good); }
  .ov-iso-tag { font-size: 9px; font-weight: 700; text-align: right;
    text-transform: uppercase; }
  .ov-iso-tag.hit    { color: var(--bad); }
  .ov-iso-tag.spared { color: var(--good); }

  .ov-cell-row { display: grid; grid-template-columns: 1fr 55px; gap: 8px;
    align-items: center; margin-bottom: 4px; font-size: 11px; }
  .ov-cell-lbl { color: var(--ink-2); font-size: 11px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .ov-cell-track { height: 8px; background: var(--line); border-radius: 3px;
    margin-top: 2px; }
  .ov-cell-fill { height: 100%; border-radius: 3px; }
  .ov-cell-fill.hit     { background: var(--bad); }
  .ov-cell-fill.partial { background: var(--warn); }
  .ov-cell-fill.spared  { background: var(--good); }
  .ov-cell-status { font-size: 9px; font-weight: 700; text-align: right;
    text-transform: uppercase; }
  .ov-cell-status.hit     { color: var(--bad); }
  .ov-cell-status.partial { color: var(--warn); }
  .ov-cell-status.spared  { color: var(--good); }

  .ov-tis-group { margin-bottom: 8px; }
  .ov-tis-group-h { font-size: 9px; text-transform: uppercase; letter-spacing: 0.05em;
    font-weight: 700; margin-bottom: 4px; }
  .ov-tis-chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .ov-tis-chip { padding: 2px 7px; border-radius: 3px; font-size: 10px;
    font-family: "SF Mono", Menlo, monospace; }
  .ov-tis-chip.hit    { background: var(--bad-soft);  color: var(--bad); }
  .ov-tis-chip.spared { background: var(--good-soft); color: var(--good); }

  .ov-pw-row { display: grid; grid-template-columns: 1fr 40px; align-items: center;
    gap: 8px; font-size: 11px; margin-bottom: 4px; }
  .ov-pw-lbl { color: var(--ink-2); font-size: 10px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .ov-pw-track { height: 6px; background: var(--line); border-radius: 3px;
    margin-top: 3px; }
  .ov-pw-fill { height: 100%; background: var(--good); border-radius: 3px; }
  .ov-pw-val { text-align: right; color: var(--ink-3); font-variant-numeric: tabular-nums;
    font-size: 10px; }

  /* exon SVG (compact) */
  .ov-exon-svg { width: 100%; display: block; }

  /* --------- Right panel: generative --------- */
  .gen-artifact { padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .gen-artifact:last-child { border-bottom: none; }
  .gen-artifact-h { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--ink-3); font-weight: 700; margin-bottom: 8px;
    display: flex; align-items: center; gap: 8px; }
  .gen-artifact-badge { background: var(--accent); color: white; padding: 1px 6px;
    border-radius: 3px; font-size: 9px; font-weight: 700; letter-spacing: 0.04em; }
  .gen-artifact-h .close { margin-left: auto; background: transparent;

    line-height: 1; }
  .gen-artifact-h .close:hover { border-color: var(--line-2); color: var(--ink); }

  /* World-model provenance + trace layer --------------------------- */
  .gen-provenance { display: flex; align-items: center; gap: 8px;
    padding: 6px 10px; background: var(--accent-soft);
    border: 1px solid var(--accent); border-radius: 6px;
    margin-bottom: 10px; font-size: 11px; color: var(--ink-2); }
  .gen-provenance-badge { background: var(--accent); color: white;
    padding: 2px 7px; border-radius: 3px; font-size: 10px; font-weight: 700;
    letter-spacing: 0.04em; }
  .gen-provenance b { color: var(--ink); font-weight: 600; }
  .gen-provenance .gen-provenance-sep { color: var(--ink-3); margin: 0 4px; }
  .gen-regenerate { margin-left: auto; background: white;
    border: 1px solid var(--accent); color: var(--accent);
    padding: 3px 10px; border-radius: 4px; font-size: 11px; font-weight: 600;
    cursor: pointer; font-family: inherit; }
  .gen-regenerate:hover { background: var(--accent); color: white; }

  .premises-drawer { margin: 10px 0; border: 1px solid var(--line);
    border-radius: 8px; background: var(--bg); }
  .premises-drawer-h { padding: 8px 12px; font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--ink-3); font-weight: 700;
    border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 6px; }
  .premises-drawer-h b { color: var(--ink); }
  .premise-row { display: grid; grid-template-columns: 130px 42px 1fr;
    gap: 8px; align-items: baseline; padding: 6px 12px; font-size: 11px;
    border-bottom: 1px solid var(--line); }
  .premise-row:last-child { border-bottom: none; }
  .premise-source { font-family: "SF Mono", Menlo, monospace; font-size: 10px;
    color: var(--ink-2); background: var(--panel); padding: 2px 6px;
    border-radius: 3px; text-align: center; border: 1px solid var(--line-2); }
  .premise-weight { font-variant-numeric: tabular-nums; font-weight: 700;
    text-align: right; font-size: 10px; }
  .premise-weight.pos { color: var(--good); }
  .premise-weight.neg { color: var(--bad); }
  .premise-rationale { color: var(--ink-2); line-height: 1.4; }

  /* --------- 4-column compare-hypotheses artifact --------- */
  .cmp-grid { display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 8px; margin-top: 8px; }
  .cmp-col { border: 1px solid var(--line-2); border-radius: 8px;
    background: var(--bg); padding: 10px 10px 12px; display: flex;
    flex-direction: column; gap: 8px; min-width: 0; }
  .cmp-col.rank-1 { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .cmp-hd { display: flex; justify-content: space-between; align-items: baseline;
    gap: 6px; }
  .cmp-hd b { font-size: 13px; color: var(--ink); }
  .cmp-hd .cmp-rank { font-size: 10px; color: var(--ink-3);
    font-variant-numeric: tabular-nums; }
  .cmp-name { font-size: 11px; color: var(--ink-2); line-height: 1.3;
    font-weight: 500; }
  .cmp-axes { display: flex; flex-direction: column; gap: 4px; margin-top: 2px; }
  .cmp-axis { display: grid; grid-template-columns: 60px 1fr 32px;
    gap: 4px; align-items: center; font-size: 10px; }
  .cmp-axis-lbl { color: var(--ink-3); text-transform: uppercase;
    letter-spacing: 0.05em; font-size: 9px; }
  .cmp-axis-bar { height: 6px; background: var(--panel); border-radius: 3px;
    overflow: hidden; }
  .cmp-axis-bar-fill { height: 100%; border-radius: 3px; }
  .cmp-axis-v { font-variant-numeric: tabular-nums; font-weight: 600;
    color: var(--ink); text-align: right; font-size: 10px; }
  .cmp-axis-v.neg { color: var(--bad); }
  .cmp-claim { font-size: 11px; color: var(--ink-2); line-height: 1.4;
    padding: 8px; background: var(--panel); border-radius: 5px;
    border-left: 2px solid var(--accent); }
  .cmp-premises { list-style: none; margin: 0; padding: 0; font-size: 10.5px; }
  .cmp-premises li { display: grid; grid-template-columns: 32px 1fr;
    gap: 6px; padding: 3px 0; align-items: baseline; }
  .cmp-premises .w { font-variant-numeric: tabular-nums; font-weight: 700;
    color: var(--good); text-align: right; }
  .cmp-premises .w.neg { color: var(--bad); }
  .cmp-premises .r { color: var(--ink-2); line-height: 1.35; }
  .cmp-flags { display: flex; gap: 4px; flex-wrap: wrap; font-size: 9px;
    text-transform: uppercase; letter-spacing: 0.04em; }
  .cmp-flag { padding: 2px 6px; border-radius: 3px; font-weight: 700; }
  .cmp-flag.contra { background: var(--warn-soft, #fff2c8); color: var(--warn); }
  .cmp-flag.top    { background: var(--accent); color: white; }

  /* --------- Substrate explorer artifact --------- */
  .sub-table { width: 100%; border-collapse: collapse; font-size: 11px;
    margin-top: 6px; }
  .sub-table th { text-align: left; padding: 6px 8px; color: var(--ink-3);
    text-transform: uppercase; letter-spacing: 0.04em; font-size: 9px;
    font-weight: 700; border-bottom: 1px solid var(--line-2); }
  .sub-table td { padding: 7px 8px; vertical-align: top; line-height: 1.35;
    border-bottom: 1px solid var(--line); color: var(--ink-2); }
  .sub-table tr.hi td { background: var(--accent-soft); }
  .sub-table tr.dim td { color: var(--ink-3); }
  .sub-src { font-family: "SF Mono", Menlo, monospace; font-size: 10px;
    color: var(--ink); font-weight: 700; }
  .sub-type { display: inline-block; padding: 1px 6px; border-radius: 3px;
    font-size: 9px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.04em; }
  .sub-type.data  { background: var(--accent-soft); color: var(--accent); }
  .sub-type.model { background: var(--panel); color: var(--ink-2);

  .sub-count { font-variant-numeric: tabular-nums; text-align: right;
    color: var(--ink); font-weight: 600; }
  .sub-desc { color: var(--ink-2); }
  .sub-desc a { color: var(--accent); text-decoration: none; }
  .sub-desc a:hover { text-decoration: underline; }

  /* --------- Pareto scatter artifact --------- */
  .pareto-wrap { display: grid; grid-template-columns: 1fr 220px; gap: 12px;
    margin-top: 6px; }
  .pareto-svg { width: 100%; height: 320px; background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; }
  .pareto-pt { cursor: pointer; transition: r 0.15s; }
  .pareto-pt:hover { r: 12; }
  .pareto-lbl { font-family: "SF Mono", Menlo, monospace; font-size: 11px;
    font-weight: 700; fill: white; pointer-events: none; }
  .pareto-controls { display: flex; flex-direction: column; gap: 10px;
    font-size: 11px; color: var(--ink-2); }
  .pareto-ctrl { display: flex; flex-direction: column; gap: 3px; }
  .pareto-ctrl label { display: flex; justify-content: space-between;
    font-size: 10px; color: var(--ink-3); text-transform: uppercase;
    letter-spacing: 0.04em; }
  .pareto-ctrl input[type=range] { width: 100%; }
  .pareto-frontier { stroke: var(--accent); stroke-width: 2;

  .pareto-score-tbl { width: 100%; font-size: 11px; margin-top: 4px; }
  .pareto-score-tbl td { padding: 3px 4px; border-bottom: 1px solid var(--line); }
  .pareto-score-tbl .name { color: var(--ink); font-weight: 600; }
  .pareto-score-tbl .val  { text-align: right; font-variant-numeric: tabular-nums;
    font-weight: 700; color: var(--accent); }


  .therapies-panel { margin: 10px 0; padding: 10px 12px;
    background: var(--good-soft); border: 1px solid var(--good);
    border-radius: 8px; }
  .therapies-panel-h { font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--good); font-weight: 700;
    margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .therapies-panel-h b { color: var(--ink); }
  .therapy-card { background: var(--panel); border: 1px solid var(--line);
    border-radius: 6px; padding: 8px 10px; margin-bottom: 6px; }
  .therapy-card:last-child { margin-bottom: 0; }
  .therapy-card-head { display: flex; align-items: center; gap: 8px;
    margin-bottom: 4px; }
  .therapy-modality { background: var(--good); color: white;
    padding: 2px 7px; border-radius: 3px; font-size: 10px; font-weight: 700;
    letter-spacing: 0.04em; }
  .therapy-modality.ASO           { background: var(--sky); }
  .therapy-modality.small_molecule{ background: var(--violet); }
  .therapy-modality.readthrough   { background: var(--warn); }
  .therapy-design { font-family: "SF Mono", Menlo, monospace; font-size: 10px;
    color: var(--ink-3); flex: 1; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .therapy-eligibility { font-size: 9px; text-transform: uppercase;
    padding: 2px 6px; border-radius: 3px; font-weight: 700; }
  .therapy-eligibility.eligible            { background: var(--good-soft); color: var(--good); }
  .therapy-eligibility.excluded            { background: var(--bad-soft);  color: var(--bad); }
  .therapy-eligibility.screening_required  { background: var(--warn-soft); color: var(--warn); }
  .therapy-eligibility.unknown             { background: var(--line);      color: var(--ink-3); }
  .therapy-rationale { color: var(--ink-2); font-size: 11px; line-height: 1.4; }

  .pss-provenance { font-size: 9px; color: var(--ink-3);
    margin-left: 4px; font-family: "SF Mono", Menlo, monospace; }

  /* Score vector strip — shows the multi-dimensional ranking */
  .score-vector { display: flex; gap: 10px; align-items: center;
    padding: 8px 12px; background: var(--bg); border: 1px solid var(--line);
    border-radius: 6px; margin-bottom: 10px; font-size: 11px; }
  .sv-metric { display: flex; flex-direction: column; gap: 2px; align-items: center;
    min-width: 60px; }
  .sv-metric-label { font-size: 9px; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--ink-3); font-weight: 700; }
  .sv-metric-value { font-size: 14px; font-weight: 700; color: var(--ink);
    font-variant-numeric: tabular-nums; }
  .sv-metric-bar { height: 4px; width: 60px; background: var(--line);
    border-radius: 2px; overflow: hidden; margin-top: 2px; }
  .sv-metric-fill { height: 100%; background: var(--good); }
  .sv-hint { color: var(--ink-3); font-size: 10px; font-style: italic;
    margin-left: auto; }
  .sv-metric-fill.warn { background: var(--warn); }
  .sv-metric-fill.bad  { background: var(--bad); }

  /* Refined-claim panel — Layer 1 deterministic + Layer 2 LLM narrative */
  .hyp-summary { margin: 10px 0 6px; padding: 10px 14px;
    background: #f0f7ff; border: 1px solid #cfe0f4;
    border-left: 4px solid #4a7fd4; border-radius: 6px; }
  .hyp-summary-h { font-size: 9px; font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.08em; color: #3a5c8a; margin-bottom: 4px;
    display: flex; align-items: baseline; gap: 8px; }
  .hyp-summary-model { font-size: 8px; font-weight: 500; color: #6b83a5;
    font-style: italic; text-transform: none; letter-spacing: 0; }
  .hyp-summary-body { font-size: 13px; font-weight: 600; color: var(--ink);
    line-height: 1.4; }

  .refined-claim { margin: 10px 0; padding: 12px 14px;
    background: var(--panel); border: 1px solid var(--line);
    border-left: 3px solid var(--accent); border-radius: 6px; }
  .refined-claim-h { font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--ink-3); font-weight: 700;
    margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
  .refined-claim-h .layer-badge { background: var(--accent-soft);
    color: var(--accent); padding: 1px 6px; border-radius: 3px;
    font-size: 9px; }
  .refined-claim-h .model-tag { color: var(--ink-3);

  .refined-narrative { font-size: 13px; line-height: 1.55; color: var(--ink);

  .refined-details { display: flex; flex-direction: column; gap: 6px;
    margin-top: 8px; }
  .refined-section { border: 1px solid var(--line); border-radius: 5px;
    background: var(--bg); overflow: hidden; }
  .refined-section summary { padding: 6px 10px; font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2);
    font-weight: 700; cursor: pointer; user-select: none; }
  .refined-section[open] summary { border-bottom: 1px solid var(--line); }
  .refined-section-body { padding: 8px 10px; font-size: 12px;
    color: var(--ink-2); line-height: 1.5; }
  .refined-section-body ul { margin: 0; padding-left: 20px; }
  .refined-section-body li { margin-bottom: 4px; }
  .cbd-item { padding: 4px 0; border-bottom: 1px dashed var(--line); }
  .cbd-item:last-child { border-bottom: none; }
  .cbd-item .other-id { font-weight: 700; color: var(--ink);
    font-family: "SF Mono", Menlo, monospace; margin-right: 6px; }

  /* Contradictions panel — shown under the score vector when consistency < 1 */
  .contradictions-panel { margin: 10px 0; padding: 10px 12px;
    background: var(--warn-soft); border: 1px solid var(--warn);
    border-radius: 8px; }
  .contradictions-panel-h { font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--warn); font-weight: 700;
    margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .contradictions-panel-h b { color: var(--ink); }
  .contra-card { background: var(--panel); border: 1px solid var(--line);
    border-radius: 6px; padding: 8px 10px; margin-bottom: 6px; }
  .contra-card:last-child { margin-bottom: 0; }
  .contra-card-head { display: flex; align-items: center; gap: 8px;
    margin-bottom: 6px; font-size: 11px; color: var(--ink-2); }
  .contra-position { font-family: "SF Mono", Menlo, monospace;
    color: var(--ink); font-weight: 700;
    background: var(--bg); padding: 2px 6px; border-radius: 3px; }
  .contra-signs { font-family: "SF Mono", Menlo, monospace; font-size: 10px; }
  .contra-signs .pos { color: var(--good); }
  .contra-signs .neg { color: var(--bad); }

    font-size: 11px; line-height: 1.4; margin-bottom: 3px; }
  .contra-row .marker { font-weight: 700; min-width: 44px; text-align: right;
    font-family: "SF Mono", Menlo, monospace; }
  .contra-row.pos .marker { color: var(--good); }
  .contra-row.neg .marker { color: var(--bad); }
  .contra-row .rationale { color: var(--ink-2); flex: 1; }

  /* Evidence badge on each layered-chain box */
  .lc-evidence-badge { display: inline-block; margin-left: 6px;
    padding: 1px 6px; font-size: 9px; font-family: "SF Mono", Menlo, monospace;
    color: var(--good); background: var(--good-soft); border-radius: 3px;
    font-weight: 700; vertical-align: middle; }
  .lc-evidence-badge.empty { color: var(--ink-3); background: var(--line); }
  .lc-evidence-badge.inferred { color: #6b5a1c; background: #fdf2c8; }

  /* Edge label showing premise count / weight */
  .lc-edge-label { font-size: 9px; color: var(--good); font-weight: 700;
    font-family: "SF Mono", Menlo, monospace; margin-left: 4px;
    padding: 1px 5px; background: var(--good-soft); border-radius: 3px; }
  .lc-edge-label.inferred { color: #6b5a1c; background: #fdf2c8; }

  /* ESM3 3D structure artifact ------------------------------------- */
  .esm3-wrap { padding: 6px 0; }
  .esm3-lede { font-size: 12px; color: var(--ink-2); line-height: 1.5;
    padding: 8px 12px; background: var(--bg); border-radius: 6px;
    border-left: 3px solid var(--accent); margin-bottom: 10px; }
  .esm3-meta { display: flex; gap: 14px; flex-wrap: wrap;
    font-size: 11px; color: var(--ink-3); margin: 6px 0 10px; }
  .esm3-meta b { color: var(--ink-2); }
  .esm3-viewer { position: relative; width: 100%; height: 360px;
    background: #1a2233; border-radius: 8px; overflow: hidden; }
  .esm3-viewer canvas { display: block; }
  .esm3-grid { display: grid; grid-template-columns: 1fr 1fr;
    gap: 12px; margin: 8px 0; }
  .esm3-panel { display: flex; flex-direction: column; gap: 6px;
    background: var(--panel); border: 1px solid var(--line-2);
    border-radius: 8px; padding: 8px; }
  .esm3-panel-h { font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--ink-2); font-weight: 700; }
  .esm3-panel-h-sub { text-transform: none; letter-spacing: 0;
    color: var(--ink-3); font-weight: 500; margin-left: 6px; font-size: 10px; }
  .esm3-panel-meta { font-size: 10px; color: var(--ink-3); text-align: center; }
  .esm3-panel-meta b { color: var(--ink-2); }
  .esm3-legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px;
    font-size: 11px; color: var(--ink-2); }
  .esm3-legend-sw { display: inline-block; width: 12px; height: 12px;
    border-radius: 50%; vertical-align: middle; margin-right: 4px; }
  .esm3-hint { color: var(--ink-3); font-size: 10px; margin-top: 6px;
    font-style: italic; }
  .esm3-unavailable { color: var(--ink-3); font-size: 12px; padding: 16px;
    background: var(--bg); border-radius: 6px; text-align: center; }

  /* Protein renders panel (WT vs truncated PyMOL PNGs + domain overlay) ------ */
  .protein-viz-panel { margin: 12px 0; padding: 10px 12px;
    background: var(--panel); border: 1px solid var(--line-2);
    border-radius: 8px; }
  .protein-viz-h { font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--ink-2); font-weight: 700;
    display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .protein-viz-badge { background: #6b4b8f; color: white; padding: 2px 6px;
    border-radius: 3px; font-size: 9px; letter-spacing: 0.08em; }
  .protein-viz-sub { margin-left: auto; text-transform: none;
    letter-spacing: 0; font-weight: 500; color: var(--ink-3); font-size: 10px; }
  .protein-viz-grid { display: grid; grid-template-columns: 1fr 1fr;
    gap: 12px; }
  .pv-col { display: flex; flex-direction: column; gap: 6px;
    background: var(--bg); border-radius: 6px; padding: 8px;
    border: 1px solid var(--line); }
  .pv-col-h { font-size: 11px; font-weight: 700; color: var(--ink-2);
    text-transform: uppercase; letter-spacing: 0.04em; }
  .pv-col-h-sub { font-weight: 500; letter-spacing: 0; text-transform: none;
    color: var(--ink-3); margin-left: 6px; font-size: 10px; }
  .pv-render { width: 100%; height: auto; display: block;
    background: white; border-radius: 4px; border: 1px solid var(--line); }
  .pv-domain-track { position: relative; display: flex; height: 22px;
    width: 100%; margin-top: 4px; border-radius: 3px; overflow: hidden;
    border: 1px solid var(--line-2); }
  .pv-domain { position: relative; display: flex; align-items: center;
    justify-content: center; overflow: hidden; cursor: help;
    transition: filter 0.12s; border-right: 1px solid rgba(255,255,255,0.35); }
  .pv-domain:last-child { border-right: none; }
  .pv-domain:hover { filter: brightness(0.92); }
  .pv-domain.truncated { background-image:
    repeating-linear-gradient(45deg, transparent 0 4px,
      rgba(0,0,0,0.18) 4px 8px) !important;
    opacity: 0.35; }
  .pv-domain.partial .pv-domain-partial {
    position: absolute; top: 0; bottom: 0; right: 0;
    background: repeating-linear-gradient(45deg, transparent 0 4px,
      rgba(0,0,0,0.28) 4px 8px);
    opacity: 0.55; }
  .pv-domain-label { font-size: 9px; font-weight: 700;
    color: rgba(0,0,0,0.72); letter-spacing: 0.02em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    padding: 0 4px; text-shadow: 0 1px 0 rgba(255,255,255,0.4); }
  .pv-cut-marker { position: absolute; top: -14px; bottom: -2px;
    z-index: 3; pointer-events: auto; cursor: help;
    transform: translateX(-50%); }
  .pv-cut-line { position: absolute; top: 0; bottom: 0; left: 50%;
    width: 2px; background: #c94a4a; transform: translateX(-50%); }
  .pv-cut-label { position: absolute; top: -14px; left: 50%;
    transform: translateX(-50%);
    font-size: 9px; font-weight: 700; color: #c94a4a;
    white-space: nowrap; background: white; padding: 0 3px; }
  .pv-lost-summary { font-size: 11px; color: var(--ink-2); margin-top: 8px;
    padding: 6px 10px; background: var(--bg);
    border-left: 3px solid #c94a4a; border-radius: 3px; }

  /* NMD × ACMG Marimekko artifact ---------------------------------- */
  .mek-wrap { padding: 6px 0; }
  .mek-lede { font-size: 12px; color: var(--ink-2); line-height: 1.5;
    padding: 8px 12px; background: var(--bg); border-radius: 6px;
    border-left: 3px solid var(--accent); margin-bottom: 10px; }
  .mek-svg { width: 100%; height: auto; display: block; }
  .mek-legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px;
    font-size: 11px; color: var(--ink-2); }
  .mek-legend-sw { width: 12px; height: 12px; border-radius: 2px;
    display: inline-block; vertical-align: middle; margin-right: 4px; }
  .mek-notes { color: var(--ink-3); font-size: 10px; margin-top: 8px;
    font-style: italic; }

  /* patient-scoring strip (compact, above the Dashboard-style hyp table) */
  .pat-scoring-strip { margin-bottom: 10px; padding: 8px 10px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
  .pss-h { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--ink-3); font-weight: 700; margin-bottom: 6px; }
  .pss-h .pss-sub { text-transform: none; letter-spacing: 0; color: var(--ink-3);
    font-weight: 500; margin-left: 4px; }
  .pss-rows { display: flex; flex-direction: column; gap: 3px; }
  .pss-row { display: grid; grid-template-columns: 34px 40px 40px 1fr auto;
    gap: 8px; align-items: baseline; font-size: 11px; padding: 4px 6px;
    border-radius: 3px; cursor: pointer; }
  .pss-row:hover { background: var(--panel); }
  .pss-row.sel { background: var(--accent-soft); }
  .pss-rank { color: var(--ink-3); font-weight: 700; font-variant-numeric: tabular-nums; }
  .pss-hid  { font-family: "SF Mono", Menlo, monospace; font-weight: 700; color: var(--ink-2); }
  .pss-row.sel .pss-hid { color: var(--accent); }
  .pss-score{ font-variant-numeric: tabular-nums; font-weight: 700;
    color: var(--ink-2); text-align: right; }
  .pss-fit  { color: var(--ink-2); font-style: italic; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .pss-pe   { color: var(--ink-3); font-size: 10px; text-align: right;
    flex-shrink: 0; }
  .pss-pe b { color: var(--bad); font-weight: 700; }

  /* make the Dashboard hyp table render nicely inside our artifact */
  .gen-artifact table.hyp { margin-top: 4px; }
  .gen-artifact table.hyp .section-lbl { display: none; }
  .gen-artifact table.hyp .panel { padding: 0; }

  /* chain artifact */
  .chain-toggle { display: inline-flex; border: 1px solid var(--line-2);
    border-radius: 5px; overflow: hidden; margin-left: 8px; }
  .chain-toggle button { background: transparent; border: none; padding: 3px 8px;
    font: inherit; font-size: 11px; color: var(--ink-3); font-weight: 600;
    cursor: pointer; }
  .chain-toggle button.active { background: var(--accent); color: white; }
  .chain-lede { font-size: 12px; color: var(--ink-2); line-height: 1.5;
    margin: 8px 0; padding: 10px 12px; background: var(--bg); border-radius: 6px;
    border-left: 3px solid var(--accent); }
  .chain-pe { background: var(--bad-soft); border: 1px solid var(--bad);
    border-radius: 8px; padding: 10px 12px; margin: 8px 0; }
  .chain-pe-h { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--bad); font-weight: 700; margin-bottom: 6px; }
  .chain-pe ul { list-style: none; padding: 0; margin: 0; }
  .chain-pe li { display: flex; gap: 6px; padding: 3px 0; font-size: 11px;
    color: var(--ink); line-height: 1.4; }
  .chain-pe li .tick { color: var(--bad); font-weight: 800; flex: 0 0 10px; }

  /* layered biological chain (reuse-ish styles from patient.html) */
  .lc-container { position: relative; padding: 8px 0; }
  .lc-stack { display: flex; flex-direction: column; padding-right: 170px; }
  .lc-row { display: grid; grid-template-columns: 120px 1fr; gap: 10px;
    cursor: help; }
  .lc-row:hover .lc-box { box-shadow: 0 0 0 2px rgba(66,131,230,0.28); }
  .lc-arrow { cursor: help; }
  .lc-arrow:hover .lc-edge-label { background: rgba(66,131,230,0.14); }
  .lc-tag { display: flex; align-items: center; justify-content: flex-end;
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--ink-3); font-weight: 700; padding-right: 4px;
    border-right: 2px solid var(--line-2); }
  .lc-row.variant     .lc-tag { color: var(--accent); border-right-color: var(--accent); }
  .lc-row.protein     .lc-tag { color: var(--violet); border-right-color: var(--violet); }
  .lc-row.pathway     .lc-tag { color: var(--teal);   border-right-color: var(--teal); }
  .lc-row.subcellular .lc-tag { color: var(--sky);    border-right-color: var(--sky); }
  .lc-row.cellType    .lc-tag { color: var(--warn);   border-right-color: var(--warn); }
  .lc-row.tissue      .lc-tag { color: var(--pink);   border-right-color: var(--pink); }
  .lc-row.phenotype   .lc-tag { color: var(--bad);    border-right-color: var(--bad); }
  .lc-box { padding: 8px 12px; border: 1px solid var(--line-2); border-radius: 6px;
    background: var(--panel); margin: 4px 0; }
  .lc-row.variant     .lc-box { border-color: var(--accent); background: #eaf1fb; }
  .lc-row.protein     .lc-box { border-color: var(--violet); background: #f3ecfb; }
  .lc-row.pathway     .lc-box { border-color: var(--teal);   background: #e6f4f4; }
  .lc-row.subcellular .lc-box { border-color: var(--sky);    background: #eaf1fa; }
  .lc-row.cellType    .lc-box { border-color: var(--warn);   background: #fbf1e2; }
  .lc-row.tissue      .lc-box { border-color: var(--pink);   background: #f9e9f0; }
  .lc-row.phenotype   .lc-box { border-color: var(--bad);    background: #fbe6e6; }
  .lc-title { font-size: 12px; font-weight: 700; color: var(--ink); }
  .lc-meta  { font-size: 10px; color: var(--ink-3); margin-top: 2px; }
  .lc-arrow { grid-column: 2; height: 10px; display: flex; align-items: center;
    padding-left: 30px; }
  .lc-loopback { position: absolute; top: 8px; right: 0; width: 170px;
    height: calc(100% - 16px); pointer-events: none; }
  .lc-therapy-label { position: absolute; right: 6px; top: 50%;
    transform: translateY(-50%); background: var(--good-soft);
    border: 1px solid var(--good); border-radius: 8px; padding: 8px 10px;
    width: 150px; text-align: center; }
  .lc-therapy-lbl-h { font-size: 9px; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--good); font-weight: 700; margin-bottom: 3px; }
  .lc-therapy-lbl-title { font-size: 11px; font-weight: 700; color: var(--ink); line-height: 1.3; }
  .lc-therapy-lbl-sub { font-size: 10px; color: var(--ink-3); margin-top: 3px; line-height: 1.3; }

  /* chat */
  .chat-turn { padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .chat-turn.user { background: var(--bg); }
  .chat-turn-role { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--ink-3); font-weight: 700; margin-bottom: 4px; }
  .chat-turn.user .chat-turn-role { color: var(--accent); }
  .chat-turn-body { font-size: 13px; line-height: 1.5; color: var(--ink); }
  .chat-turn-body b { font-weight: 700; }
  .chat-cursor { display: inline-block; width: 6px; height: 12px;
    background: var(--accent); animation: blink 0.9s infinite; vertical-align: middle;
    margin-left: 2px; }
  @keyframes blink { 0%, 50% { opacity: 1 } 51%, 100% { opacity: 0 } }

  /* --------- chat command bar (inside right panel, above artifact stream) --------- */
  .pc-chat-bar { flex-shrink: 0; background: var(--bg);
    border-bottom: 1px solid var(--line); }
  .pc-input-row { display: flex; gap: 6px; padding: 8px 10px;
    border-bottom: 1px solid var(--line); align-items: center; }
  .pc-input-row .pc-input-lbl { font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--ink-3); font-weight: 700;
    padding: 0 6px 0 4px; flex-shrink: 0; }
  .pc-input { flex: 1; padding: 7px 10px; border: 1px solid var(--line-2);
    border-radius: 6px; font-size: 12px; font-family: inherit; color: var(--ink);
    background: white; }
  .pc-input:focus { outline: none; border-color: var(--accent); }
  .pc-send { padding: 6px 14px; background: var(--accent); color: white;
    border: none; border-radius: 6px; font-size: 12px; font-weight: 600;
    cursor: pointer; font-family: inherit; }
  .pc-send:disabled { background: var(--line-2); cursor: not-allowed; }
  .pc-suggest-row { padding: 6px 12px 8px; display: flex; gap: 5px; flex-wrap: wrap;
    align-items: center; }
  .pc-suggest-lbl { font-size: 9px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--ink-3); font-weight: 700; margin-right: 4px; }
  .pc-suggest { background: var(--bg); border: 1px solid var(--line-2);
    border-radius: 12px; padding: 3px 9px; font-size: 11px; color: var(--ink-2);
    cursor: pointer; font-family: inherit; }
  .pc-suggest:hover { border-color: var(--accent); color: var(--accent); }
  .pc-more-toggle { background: transparent; border: none; color: var(--ink-3);
    font-size: 11px; cursor: pointer; padding: 3px 6px; font-family: inherit;
    margin-left: auto; }
  .pc-more-toggle:hover { color: var(--accent); }

  /* --------- expandable "See more example questions" panel --------- */
  /* Styled to match Dynamic Dashboard's more-panel (generative.html):
     rounded card, full border, wider padding, same chip look. Scrolls
     internally so it never pushes the artifact stream out of view. */
  .pc-more-panel { padding: 14px 16px; margin: 10px 14px 12px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px;
    max-height: 55vh; overflow-y: auto; }
  .pc-more-panel[hidden] { display: none; }
  .pc-more-hd { display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px; }
  .pc-more-hd h3 { margin: 0; font-size: 12px; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--ink-3); font-weight: 600; }
  .pc-more-close { background: transparent; border: none; color: var(--ink-3);
    font-size: 16px; cursor: pointer; padding: 0 4px; }
  .pc-more-close:hover { color: var(--ink); }
  /* 3-column layout. Categories flow top-to-bottom within each column
     (CSS multi-columns pack tightly — no row-alignment gaps like grid). */
  .pc-cats { column-count: 4; column-gap: 14px; }
  .pc-cat { break-inside: avoid; margin-bottom: 12px; display: block; }
  .pc-cat h4 { font-size: 13px; color: var(--ink); margin: 0 0 6px;
    font-weight: 700; text-transform: none; letter-spacing: 0; }
  .pc-cat-item { display: flex; flex-direction: column; align-items: stretch;
    gap: 2px; padding: 6px 10px; margin-bottom: 4px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; cursor: pointer; font-family: inherit;
    text-align: left; width: 100%; }
  .pc-cat-item:hover { border-color: var(--accent); color: var(--accent); }
  .pc-cat-item-tag { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 10px; color: var(--ink-3); }
  .pc-cat-item-q { font-size: 11.5px; color: var(--ink); }
  .pc-cat-item:hover .pc-cat-item-tag { color: var(--accent); }
  .pc-cat-item:hover .pc-cat-item-q   { color: var(--accent); }

  /* edge modal (reused, minor tweaks) */
  .edge-modal-backdrop { position: fixed; inset: 0; background: rgba(26,34,51,0.45);
    display: flex; align-items: center; justify-content: center; z-index: 1000;
    padding: 20px; }
  .edge-modal { background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 20px 22px; max-width: 640px; width: 100%;
    max-height: 80vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.25); }
  .edge-modal-h { display: flex; justify-content: space-between; align-items: flex-start;
    gap: 12px; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .edge-modal-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--ink-3); font-weight: 700; margin-bottom: 4px; }
  .edge-modal-arrow { font-size: 14px; color: var(--ink); line-height: 1.35; }
  .edge-modal-arrow b { color: var(--accent); font-weight: 700; }
  .edge-modal-arrow .arrow-sep { color: var(--ink-3); margin: 0 8px; }
  .edge-modal-close { background: var(--bg); border: 1px solid var(--line-2);
    border-radius: 6px; padding: 4px 10px; font-size: 16px; cursor: pointer;
    color: var(--ink-2); font-family: inherit; }
  .edge-modal-close:hover { background: var(--line); color: var(--ink); }
  .edge-modal-body ul { list-style: none; margin: 0; padding: 0; }
  .edge-modal-body li { display: flex; gap: 10px; padding: 10px 0;
    font-size: 13px; line-height: 1.5; color: var(--ink-2);
    border-bottom: 1px solid var(--line); }
  .edge-modal-body li:last-child { border-bottom: none; }
  .edge-modal-body .tick { color: var(--good); font-weight: 800; flex: 0 0 14px; }
  .edge-modal-body .cite { color: var(--ink-3); font-size: 11px; margin-left: 8px;
    font-style: italic; }

  /* HoverFactsPopover — single global popover positioned by the hover
     handler. One DOM element, moved to whichever hover target is active. */
  .hf-popover { position: fixed; z-index: 999;
    max-width: 460px; min-width: 280px;
    background: white; border: 1px solid var(--line-2);
    border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.18);
    padding: 10px 12px; font-size: 12px; color: var(--ink);
    pointer-events: none; opacity: 0; transition: opacity 0.12s;
    max-height: 80vh; overflow-y: auto; }
  .hf-popover.visible { opacity: 1; pointer-events: auto;
    user-select: text; -webkit-user-select: text; }
  .hf-popover.wide { max-width: 720px; min-width: 620px; }
  .hf-popover .protein-viz-panel { margin: 0 0 10px 0; padding: 8px; }
  .hf-popover .pv-render { max-height: 220px; object-fit: contain; }
  .hf-popover .hf-fact { user-select: text; -webkit-user-select: text; }
  .hf-popover-h { font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--ink-3); font-weight: 700;
    margin-bottom: 6px; padding-bottom: 6px;
    border-bottom: 1px solid var(--line); }
  .hf-popover-h b { color: var(--ink-2); font-weight: 700; }
  .hf-empty { color: var(--ink-3); font-style: italic;
    padding: 8px 4px; text-align: center; }
  .hf-group { margin-bottom: 8px; }
  .hf-group:last-child { margin-bottom: 0; }
  .hf-group-h { font-size: 9px; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--ink-3); font-weight: 700;
    margin: 4px 0 4px 0; }
  .hf-fact { display: grid;
    grid-template-columns: 62px 34px 1fr;
    gap: 6px; align-items: start;
    padding: 4px 6px; margin: 2px 0; border-radius: 4px;
    background: var(--bg); border-left: 3px solid transparent; }
  .hf-fact.pos { border-left-color: var(--good); }
  .hf-fact.neg { border-left-color: var(--warn); }
  .hf-fact.neutral { border-left-color: var(--line-2); }
  .hf-fact-source { font-size: 10px; font-weight: 700; color: var(--ink-2);
    text-transform: uppercase; letter-spacing: 0.03em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hf-fact-weight { font-size: 10px; font-weight: 700;
    color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; }
  .hf-fact-weight.pos { color: var(--good); }
  .hf-fact-weight.neg { color: var(--warn); }
  .hf-fact-body { font-size: 11px; color: var(--ink); line-height: 1.4; }
  .hf-fact-evidence { color: var(--ink-3); font-size: 10px;
    margin-top: 2px; font-style: italic; }

  /* Pareto — Hypotheses tab ---------------------------------------- */
  .fr-body { padding: 14px 18px 24px; background: var(--bg); min-height: 100vh; }
  .fr-loading { text-align: center; padding: 60px; color: var(--ink-3);
    font-size: 13px; }
  .fr-header { margin-bottom: 10px; }
  .fr-title { font-size: 17px; font-weight: 700; color: var(--ink); }
  .fr-title-sub { font-weight: 500; color: var(--ink-3); font-size: 12px;
    margin-left: 10px; }
  .fr-chip-row { display: flex; align-items: center; flex-wrap: wrap;
    gap: 6px; margin: 4px 0; }
  .fr-chip-label { font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--ink-3); font-weight: 700;
    margin-right: 4px; }
  .fr-chip { background: white; border: 1px solid var(--line-2);
    padding: 4px 10px; border-radius: 12px; font-size: 11px;
    color: var(--ink-2); cursor: pointer; font-weight: 600; }
  .fr-chip:hover { background: var(--bg); }
  .fr-chip.active { background: var(--accent); color: white;
    border-color: var(--accent); }
  .fr-chip.toggle { margin-left: 12px; border-color: #d4b34a;
    color: #7a5d0f; }
  .fr-chip.toggle.active { background: #d4b34a; color: white;
    border-color: #d4b34a; }

  .fr-main { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(340px, 1fr);
    gap: 14px; margin-top: 12px; }
  .fr-plot-wrap { display: flex; flex-direction: column; gap: 6px; }
  .fr-point { cursor: pointer; transition: opacity 0.1s; }
  .fr-point:hover { opacity: 1 !important; stroke-width: 2 !important; }
  .fr-legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 11px;

<body>

<div class="pc-app" id="app"><!-- rendered by renderPage() --></div>

<script src="widget_palette.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/3Dmol/2.4.0/3Dmol-min.js"></script>
<script>
const esc = (s) => String(s ?? '').replace(/[&<>"']/g,
  c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

// ---------------------------------------------------------------------
// HoverFactsPopover — one global popover element shared across the page.
// Any element with data-hover-key="<kind>:<id>" attaches to it via a
// delegated mouseover handler. Popover resolves the key against the
// currently-focused hypothesis (currentHypId) to pull matching premises.
// ---------------------------------------------------------------------
let hfPopoverEl = null;   // lazy: created on first hover
let hfHideTimer = null;

// Classify premise source_id → one of {patient, literature, database, heuristic}
// for grouping in the popover header. Falls back to 'other'.
function hfSourceKind(sourceId) {
  if (!sourceId) return 'other';
  if (sourceId === 'literature') return 'literature';
  if (['zhang_2024', 'isoform_arch', 'synthetic_labs',
       'patient_celltype_impact', 'patient_tissue_impact',
       'nmd_prediction', 'exon_skip_viability',
       'dgc_completeness', 'absplice', 'esm3'].includes(sourceId))
    return 'patient';
  if (['hpa_expression', 'reactome', 'open_targets',
       'uniprot_subcellular', 'clinvar_nmd',
       'domain_annotation'].includes(sourceId))
    return 'database';
  return 'heuristic';
}

// Look up chain-link entries for the (kind, id) target under the given
// hypothesis. Returns array of {premiseId, sourceId, weight, rationale}.
function hfLinkEntriesFor(kind, id, storedHyp) {
  if (!storedHyp) return [];
  const nodes = storedHyp.chainLinks?.nodes || {};
  const edges = storedHyp.chainLinks?.edges || {};
  if (kind === 'node') {
    // Direct node premises
    if (nodes[id]?.length) return nodes[id];
    // Fallback: aggregate premises from any edge that touches this node,
    // deduped by premiseId. Handles nodes with sparse direct premises but
    // rich edge context (e.g. tissue in some hypotheses).
    const seen = new Set();
    const combined = [];
    const push = (e) => {
      const k = e.premiseId || `${e.sourceId}|${e.rationale}`;
      if (seen.has(k)) return;
      seen.add(k);
      combined.push(e);
    };
    Object.entries(edges).forEach(([key, list]) => {
      const [a, b] = key.split('->');
      if (a === id || b === id) list.forEach(push);
    });
    return combined;
  }
  if (kind === 'edge') {
    // 1) Direct match
    if (edges[id]?.length) return edges[id];
    // 2) The linear-chain UI produces edges like protein->pathway that the
    //    baked data may not carry as a DIRECT edge (the data stores premises
    //    on the most-specific relationship — e.g. protein->subcellular +
    //    subcellular->pathway). Aggregate premises from any edge that touches
    //    either endpoint, deduped by premiseId.
    const [a, b] = (id || '').split('->');
    if (!a || !b) return [];
    const seen = new Set();
    const combined = [];
    const push = (e) => {
      const k = e.premiseId || `${e.sourceId}|${e.rationale}`;
      if (seen.has(k)) return;
      seen.add(k);
      combined.push(e);
    };
    // Reverse direction first (semantically equivalent)
    (edges[`${b}->${a}`] || []).forEach(push);
    // Any edge starting from A or ending at B (these are the "spanning"
    // links the chain step summarises — e.g. protein->pathway aggregates
    // protein->subcellular + subcellular->pathway).
    Object.entries(edges).forEach(([key, list]) => {
      const [ka, kb] = key.split('->');
      if (ka === a || kb === b) list.forEach(push);
    });
    return combined;
  }
  return [];
}

// Enrich a chain-link entry with the full premise evidence blob (from
// storedHyp.premises). Returns {premiseId, sourceId, weight, rationale,
// evidenceExcerpt}.
function hfEnrichEntry(entry, storedHyp) {
  const full = (storedHyp?.premises || []).find(
    p => p.premiseId === entry.premiseId);
  let excerpt = '';
  if (full?.evidence) {
    const ev = full.evidence;
    // Prefer a single high-signal field, in priority order.
    excerpt = ev.rationale || ev.interpretation
             || ev.claim || ev.verdict_text
             || (ev.citation ? `Citation: ${ev.citation}` : '')
             || (ev.direct_drug ? `Approved: ${ev.direct_drug}` : '')
             || (ev.mean_dgc_completeness !== undefined
                  ? `DGC-completeness ${ev.mean_dgc_completeness} across ${(ev.affected_cells || []).length} cells`
                  : '')
             || (ev.verdict ? `verdict: ${ev.verdict}` : '')
             || '';
    // Truncate very long excerpts
    if (excerpt.length > 260) excerpt = excerpt.slice(0, 260) + '…';
  }
  return { ...entry, evidenceExcerpt: excerpt };
}

// Build popover HTML from a list of premises (already enriched).
function hfBuildHtml(title, subtitle, enrichedEntries) {
  if (!enrichedEntries.length) {
    return `<div class="hf-popover-h"><b>${esc(title)}</b> · ${esc(subtitle)}</div>
      <div class="hf-empty">No premises inform this element.</div>`;
  }
  // Group by source-kind
  const groups = {
    patient: [], literature: [], database: [], heuristic: [], other: []
  };
  enrichedEntries.forEach(e => {
    const kind = hfSourceKind(e.sourceId);
    groups[kind].push(e);
  });
  const groupLabels = {
    patient: 'Patient-specific',
    literature: 'Literature',
    database: 'Database / curated',
    heuristic: 'Heuristic / rule',
    other: 'Other',
  };
  const groupHtml = Object.entries(groups)
    .filter(([, arr]) => arr.length)
    .map(([kind, arr]) => `
      <div class="hf-group">
        <div class="hf-group-h">${esc(groupLabels[kind])} · ${arr.length}</div>
        ${arr.map(e => {
          const w = e.weight || 0;
          const cls = w > 0.001 ? 'pos' : (w < -0.001 ? 'neg' : 'neutral');
          const sign = w > 0 ? '+' : '';
          return `<div class="hf-fact ${cls}">
            <span class="hf-fact-source">${esc(e.sourceId)}</span>
            <span class="hf-fact-weight ${cls}">${sign}${w.toFixed(2)}</span>
            <div class="hf-fact-body">
              ${esc(e.rationale || '(no rationale)')}
              ${e.evidenceExcerpt ? `<div class="hf-fact-evidence">${esc(e.evidenceExcerpt)}</div>` : ''}
            </div>
          </div>`;
        }).join('')}
      </div>`).join('');
  return `<div class="hf-popover-h"><b>${esc(title)}</b> · ${esc(subtitle)}</div>${groupHtml}`;
}

// Position the popover next to a target rect, keeping it within viewport.
function hfPositionNear(targetRect) {
  if (!hfPopoverEl) return;
  const pop = hfPopoverEl;
  const margin = 8;
  const popRect = pop.getBoundingClientRect();
  let left = targetRect.left + targetRect.width / 2 - popRect.width / 2;
  let top  = targetRect.bottom + margin;
  // If it overflows bottom, place above.
  if (top + popRect.height > window.innerHeight - margin) {
    top = targetRect.top - popRect.height - margin;
  }
  // Clamp horizontally.
  left = Math.max(margin, Math.min(left, window.innerWidth - popRect.width - margin));
  top  = Math.max(margin, top);
  pop.style.left = `${left}px`;
  pop.style.top  = `${top}px`;
}

function hfShow(target) {
  if (!hfPopoverEl) {
    hfPopoverEl = document.createElement('div');
    hfPopoverEl.className = 'hf-popover';
    document.body.appendChild(hfPopoverEl);
    // Keep popover open while cursor is inside it, so users can select
    // text or click links / hover nested elements.
    hfPopoverEl.addEventListener('mouseenter', () => {
      if (hfHideTimer) { clearTimeout(hfHideTimer); hfHideTimer = null; }
    });
    hfPopoverEl.addEventListener('mouseleave', () => {
      hfHideTimer = setTimeout(hfHide, 200);
    });
  }
  const key = target.getAttribute('data-hover-key');
  if (!key) return;
  const [kind, ...rest] = key.split(':');
  const id = rest.join(':');

  const p = DATA?.patients?.find(x => x.id === currentPatientId);
  const storedHyp = (p?.hypothesisRanking || []).find(r => r.id === currentHypId);

  let title = '', subtitle = '', enriched = [];

  if (kind === 'node' || kind === 'edge') {
    const entries = hfLinkEntriesFor(kind, id, storedHyp);
    enriched = entries.map(e => hfEnrichEntry(e, storedHyp));
    title = kind === 'node' ? `${id} node` : `${id} edge`;
    subtitle = `${entries.length} premise${entries.length === 1 ? '' : 's'}`;
    // Rich viz for specific layer nodes goes above the premise list.
    if (kind === 'node' && id === 'protein') {
      const vizHtml = renderProteinRendersPanel(p, storedHyp);
      const premisesHtml = hfBuildHtml(title, subtitle, enriched);
      hfPopoverEl.classList.add('wide');
      hfPopoverEl.innerHTML = vizHtml + premisesHtml;
      hfPopoverEl.classList.add('visible');
      requestAnimationFrame(() => hfPositionNear(target.getBoundingClientRect()));
      return;
    } else {
      hfPopoverEl.classList.remove('wide');
    }
  } else if (kind === 'domain') {
    // Pull the domain_annotation premise (cohort-scope) and surface the
    // one domain matching `id` — plus any patient premise that cites it.
    const domainPremise = (storedHyp?.premises || []).find(
      pr => pr.sourceId === 'domain_annotation');
    const dom = DMD_DOMAINS_JS.find(d => d.id === id);
    if (dom) {
      title = dom.name;
      subtitle = `aa ${dom.aa_start}–${dom.aa_end}`;
      enriched = [{
        premiseId: 'domain_local',
        sourceId: 'domain_annotation',
        weight: domainPremise?.weight ?? 0.4,
        rationale: dom.function,
        evidenceExcerpt: 'Citations: ' + dom.citations.join('; '),
      }];
    }
  } else if (kind === 'cut') {
    // Cut marker: NMD verdict + exon-skip viability + domain-loss summary
    const nmdP  = (storedHyp?.premises || []).find(pr => pr.sourceId === 'nmd_prediction');
    const skipP = (storedHyp?.premises || []).find(pr => pr.sourceId === 'exon_skip_viability');
    const meta = PYMOL_RENDERS[`${p?.cohort}#${p?.cohortPatientId}`];
    title = 'Truncation point';
    subtitle = meta ? `aa ${meta.residue} · ${meta.hgvsp}` : '';
    if (nmdP) enriched.push({
      premiseId: nmdP.premiseId, sourceId: 'nmd_prediction',
      weight: nmdP.weight,
      rationale: nmdP.rationale,
      evidenceExcerpt: nmdP.evidence?.rationale || '',
    });
    if (skipP) enriched.push({
      premiseId: skipP.premiseId, sourceId: 'exon_skip_viability',
      weight: skipP.weight,
      rationale: skipP.rationale,
      evidenceExcerpt: skipP.evidence?.rationale || '',
    });
  }

  hfPopoverEl.innerHTML = hfBuildHtml(title, subtitle, enriched);
  hfPopoverEl.classList.add('visible');
  requestAnimationFrame(() => hfPositionNear(target.getBoundingClientRect()));
}

function hfHide() {
  if (!hfPopoverEl) return;
  hfPopoverEl.classList.remove('visible');
}

// Delegated hover handlers — attach once at document level.
document.addEventListener('mouseover', (e) => {
  const target = e.target.closest('[data-hover-key]');
  if (!target) return;
  if (hfHideTimer) { clearTimeout(hfHideTimer); hfHideTimer = null; }
  hfShow(target);
});
document.addEventListener('mouseout', (e) => {
  const target = e.target.closest('[data-hover-key]');
  if (!target) return;
  // Debounce hide long enough for the cursor to cross into the popover
  // (the popover has its own mouseenter that will cancel the timer).
  hfHideTimer = setTimeout(hfHide, 300);
});

function renderExonSvg(p) {
  const nExons = DATA.gene.nExons;
  const isoforms = DATA.isoforms;
  const W = 320, pad = 8;
  const trackY = 14, trackH = 8;
  const laneY0 = trackY + trackH + 6;
  const laneH = 4, laneGap = 2;
  const totalH = laneY0 + isoforms.length * (laneH + laneGap) + 12;
  const xForExon = (e) => pad + ((e - 1) / (nExons - 1)) * (W - 2 * pad);
  const lanes = isoforms.map((iso, i) => {
    const impact = p.isoformImpact.find(x => x.id === iso.id);
    const hit = impact && impact.hit;
    const x1 = xForExon(iso.firstSharedExon);
    const x2 = xForExon(nExons);
    const y  = laneY0 + i * (laneH + laneGap);
    return `<rect x="${x1}" y="${y}" width="${x2 - x1}" height="${laneH}"
              fill="${hit ? 'var(--bad)' : 'var(--good)'}" opacity="0.85"/>
            <text x="${x1 - 3}" y="${y + laneH - 0.5}" text-anchor="end"
                  font-size="7.5" font-family="SF Mono, Menlo, monospace"
                  fill="var(--ink-3)">${esc(iso.id)}</text>`;
  }).join('');
  const vE = p.variant.exonNum;
  let mark = '';
  if (vE) {
    const vx = xForExon(vE);
    mark = `<line x1="${vx}" y1="${trackY - 3}" x2="${vx}" y2="${laneY0 + isoforms.length * (laneH + laneGap)}"
              stroke="var(--bad)" stroke-width="1" stroke-dasharray="1.5 1.5"/>
            <circle cx="${vx}" cy="${trackY - 5}" r="3" fill="var(--bad)" stroke="white" stroke-width="0.8"/>`;
  }
  return `<svg class="ov-exon-svg" viewBox="0 0 ${W} ${totalH}" preserveAspectRatio="xMidYMid meet">
    <rect x="${pad}" y="${trackY}" width="${W - 2 * pad}" height="${trackH}"
          fill="var(--line)" stroke="var(--line-2)"/>
    <text x="${pad}" y="${totalH - 1}" font-size="8" fill="var(--ink-3)">exon 1</text>
    <text x="${W - pad}" y="${totalH - 1}" text-anchor="end" font-size="8" fill="var(--ink-3)">${nExons}</text>
    <text x="${W/2}" y="${totalH - 1}" text-anchor="middle" font-size="8" fill="var(--ink-3)">
      variant at exon ${esc(String(vE || '?'))}
    </text>
    ${lanes}${mark}
  </svg>`;
}
